/* ============================================================
   משימות ביצוע לסניפים — הרחבה של מודול ההוראות הקיים.
   completion אחד = מסמך אחד ב-instructionCompletions, מזוהה ע"י
   instructionId+branchEmail (כמו standConfirmations), לא מערך בתוך ההוראה.
============================================================ */
/* בודקת אם אירוע מסוים אמור להיות גלוי לצופה הנוכחי, לפי קהל היעד שנבחר
   ביצירת האירוע: 'all' (ארצי, גלוי לכולם), 'branch' (גלוי רק לסניף הספציפי
   שנבחר), 'area' (גלוי למנהל האזור הרלוונטי ולכל הסניפים תחת אותו אזור).
   מחלקת השיווק תמיד רואה הכל (לצורך ניהול), בלי קשר לקהל היעד. */
function isEventVisibleToViewer(ev){
  if(session.role==='marketing') return true;
  const audience = ev.audience || 'all';
  if(audience==='all') return true;
  if(audience==='branch'){
    return session.role==='branch' && session.branchInfo && session.branchInfo.email===ev.targetBranchEmail;
  }
  if(audience==='area'){
    if(session.role==='area') return session.areaLabel===ev.targetAreaLabel;
    if(session.role==='branch' && session.branchInfo) return session.branchInfo.area===ev.targetAreaLabel;
  }
  return false;
}
function isInstructionTargetedAtBranch(instr, branchInfo){
  if(!branchInfo) return false;
  const target = instr.targetBranches;
  if(!target || target==='all') return true;
  if(Array.isArray(target)) return target.indexOf(branchInfo.name) !== -1;
  return true;
}
function getInstructionCompletion(instructionId, branchEmail){
  return (appData.instructionCompletions||[]).find(c=>c.instructionId==instructionId && c.branchEmail===branchEmail) || null;
}
function getInstructionStatusForBranch(instr, branchEmail){
  if(!instr.requiresAction) return null;
  const completion = getInstructionCompletion(instr.id, branchEmail);
  if(completion) return 'done';
  if(instr.dueDate){
    const dueEnd = parseHebDate(instr.dueDate) + 24*60*60*1000 - 1;
    if(Date.now() > dueEnd) return 'overdue';
  }
  return 'pending';
}
/* תמונת ההוכחה נשמרת ממתינה per-instruction (לא global יחיד) כדי לתמוך במקרה
   שיותר מהוראה אחת פתוחה/מנוסה באותו זמן, בלי לבלבל בין העלאות. */
let pendingInstrPhotos = {};
function handleInstructionPhotoUpload(instructionId, evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('instr-photo-status-'+instructionId);
  if(statusEl) statusEl.textContent = '⏳ מעלה את התמונה...';
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // resize/compress בצד הלקוח לפני ההעלאה — תמונות מהטלפון לא יגיעו כבדות מדי
      const maxW = 1280;
      const scale = Math.min(1, maxW/(img.width||maxW));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round((img.width||maxW)*scale));
      canvas.height = Math.max(1, Math.round((img.height||maxW)*scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob){
        if(!blob){ if(statusEl) statusEl.textContent = '❌ לא ניתן היה לעבד את התמונה'; return; }
        uploadFileToCloudinary(blob).then(function(result){
          pendingInstrPhotos[instructionId] = result.secure_url;
          if(statusEl) statusEl.innerHTML = '✅ התמונה הועלתה';
          renderContent();
        }).catch(function(err){
          console.error(err);
          if(statusEl) statusEl.textContent = '❌ ההעלאה נכשלה: ' + err.message;
        });
      }, 'image/jpeg', 0.82);
    };
    img.onerror = function(){ if(statusEl) statusEl.textContent = '❌ לא ניתן היה לקרוא את קובץ התמונה'; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  evt.target.value = '';
}
function writeInstructionCompletion(instr, photoUrl){
  if(!session.branchInfo) return;
  const branchEmail = session.branchInfo.email;
  const confId = instr.id + '__' + branchEmail;
  const completedAt = todayHeb() + ' ' + new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  const data = {
    instructionId: instr.id, instructionTitle: instr.title,
    branchEmail, branchName: session.branchName,
    completedAt, photoUrl: photoUrl || null, requiresPhoto: !!instr.requiresPhoto
  };
  if(firebaseReady){
    db.collection('instructionCompletions').doc(confId).set(
      Object.assign({}, data, {createdAt: firebase.firestore.FieldValue.serverTimestamp()})
    ).then(function(){
      toast('✓ הביצוע נשלח בהצלחה');
      delete pendingInstrPhotos[instr.id];
      // המייל הוא התראה בלבד — ה-Firestore הוא מקור האמת. אם המייל נכשל,
      // הביצוע כבר נשמר ולא מתבטל (sendPrivateMessageEmail עצמה כבר "בולעת"
      // שגיאות שליחה ורק רושמת ל-console, בלי לזרוק/לבטל כלום).
      if(instr.requiresPhoto && photoUrl){
        const body = `התקבל ביצוע חדש דרך Nizat HUB\n\nמשימה: ${instr.title}\nסניף: ${session.branchName}\nתאריך ביצוע: ${completedAt}\n\nלצפייה בצילום:\n${photoUrl}`;
        sendPrivateMessageEmail(session.branchName, `ביצוע משימה - ${instr.title}`, body);
      }
    }).catch(function(err){
      console.error('שמירת ביצוע נכשלה:', err);
      toast('שגיאה בשמירת הביצוע: ' + err.message);
    });
  } else {
    appData.instructionCompletions.push(Object.assign({id:confId}, data));
    toast('✓ הביצוע נשלח בהצלחה');
    delete pendingInstrPhotos[instr.id];
    renderContent();
  }
}
function submitInstructionCompletion(instructionId){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const instr = appData.instructions.find(i=>i.id==instructionId);
  if(!instr) return;
  if(instr.requiresPhoto){
    const photoUrl = pendingInstrPhotos[instructionId];
    if(!photoUrl){ toast('יש להעלות תמונה לפני שליחת הביצוע'); return; }
    writeInstructionCompletion(instr, photoUrl);
  } else {
    writeInstructionCompletion(instr, null);
  }
}

/* ---------- לוח שנה חודשי לאירועים — כל חודש בחודשו, ימים עם אירוע מודגשים ----------
   לסניפים בלבד: שכבה נוספת של תזכורות אישיות פרטיות (יום הולדת/יום עיון/
   חופשת עובד/אחר), שנשמרות רק אצל הסניף עצמו (branchCalendarNotes). */
function calendarNoteDateKey(year, month, day){
  const dd = String(day).padStart(2,'0');
  const mm = String(month+1).padStart(2,'0');
  return `${dd}.${mm}.${year}`;
}
function notesForDateKey(dateKey){

/* בונה קישור "הוספה ליומן Google" לתזכורת אישית - אירוע יום שלם, בלי שום
   API/הרשאה, רק URL עם פרמטרים. dateKey בפורמט DD.MM.YYYY (כמו בכל
   האפליקציה). Google מצפה ל-YYYYMMDD/YYYYMMDD (יום התחלה/יום אחרי הסיום,
   בלעדי - לכן מוסיפים יום אחד לתאריך הסיום). */
function googleCalendarAddUrl(dateKey, text, startTime, endTime){
  const [dd, mm, yyyy] = dateKey.split('.');
  function fmtDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}${m}${day}`;
  }
  function fmtDateTime(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
    return `${y}${m}${day}T${hh}${mi}00`;
  }
  let datesParam;
  if(startTime){
    const [sh,sm] = startTime.split(':').map(Number);
    const start = new Date(Number(yyyy), Number(mm)-1, Number(dd), sh, sm||0);
    let end;
    if(endTime){
      const [eh,em] = endTime.split(':').map(Number);
      end = new Date(Number(yyyy), Number(mm)-1, Number(dd), eh, em||0);
      if(end.getTime()<=start.getTime()) end = new Date(start.getTime()+3600000);
    } else {
      end = new Date(start.getTime()+3600000);
    }
    datesParam = `${fmtDateTime(start)}/${fmtDateTime(end)}`;
  } else {
    const start = new Date(Number(yyyy), Number(mm)-1, Number(dd));
    const end = new Date(start.getTime() + 86400000);
    datesParam = `${fmtDate(start)}/${fmtDate(end)}`;
  }
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: text,
    dates: datesParam,
    details: 'נוסף מ-NIZAT HUB'
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function renderEventsCalendarGrid(list){
  if(ui.calYear==null || ui.calMonth==null){
    const now = new Date();
    ui.calYear = now.getFullYear();
    ui.calMonth = now.getMonth();
  }
  const year = ui.calYear, month = ui.calMonth;
  const isBranch = session.role==='branch' && !!session.branchInfo;
  const catIcon = {"השקה":"🚀","הדרכה":"🎓","מבצע":"🏷","תחרות":"🏆","ביקורת":"🔍","כנס":"🎤"};
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = `${HEB_MONTHS[month]} ${year}`;

  const eventsByDay = {};
  list.forEach(ev=>{
    const startTs = parseHebDate(ev.date);
    const endTs = ev.endDate ? parseHebDate(ev.endDate) : startTs;
    if(isNaN(startTs)) return;
    for(let t=startTs; t<=endTs; t+=86400000){
      const d = new Date(t);
      if(d.getFullYear()===year && d.getMonth()===month){
        const key = d.getDate();
        if(!eventsByDay[key]) eventsByDay[key] = [];
        eventsByDay[key].push(ev);
      }
    }
  });

  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push('<div class="cal-grid-cell empty"></div>');
  for(let day=1; day<=daysInMonth; day++){
    const evs = eventsByDay[day] || [];
    const hasEvents = evs.length>0;
    const isSelected = ui.calSelectedDay===day;
    let noteHtml = '', cellStyle = '';
    if(isBranch){
      const dateKey = calendarNoteDateKey(year, month, day);
      const notes = notesForDateKey(dateKey);
      if(notes.length){
        const first = notes[0];
        const color = first.color || '#DADADA';
        cellStyle = `style="background:${color}55;border-color:${color};"`;
        const extra = notes.length>1 ? ` (+${notes.length-1})` : '';
        noteHtml = `<div style="font-size:9px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary,#222);padding:0 2px;">${first.text}${extra}</div>`;
      }
    }
    cells.push(`
      <div class="cal-grid-cell ${hasEvents?'has-event':''} ${isSelected?'selected':''}" ${cellStyle} onclick="selectCalendarDay(${day})">
        <div class="cal-grid-day">${day}</div>
        ${hasEvents ? `<div class="cal-grid-dot"></div>` : ''}
        ${noteHtml}
      </div>
    `);
  }

  const selectedEvents = ui.calSelectedDay ? (eventsByDay[ui.calSelectedDay]||[]) : [];
  const selectedDateKey = ui.calSelectedDay ? calendarNoteDateKey(year, month, ui.calSelectedDay) : null;
  const selectedNotes = (isBranch && selectedDateKey) ? notesForDateKey(selectedDateKey) : [];

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <button class="icon-btn" onclick="shiftCalendarMonth(-1)">→</button>
        <div style="font-weight:600;font-size:15.5px;">${monthLabel}</div>
        <button class="icon-btn" onclick="shiftCalendarMonth(1)">←</button>
      </div>
      <div class="cal-grid-weekdays">
        ${['א','ב','ג','ד','ה','ו','ש'].map(d=>`<div>${d}</div>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells.join('')}
      </div>
      ${ui.calSelectedDay ? `
        <div style="margin-top:16px;border-top:1px solid var(--gridline);padding-top:12px;">
          <div style="font-weight:600;margin-bottom:8px;">${ui.calSelectedDay} ב${HEB_MONTHS[month]}</div>
          ${selectedEvents.length ? selectedEvents.map(ev=>`
            <div style="padding:8px 0;border-bottom:1px solid var(--gridline);">
              <div>${catIcon[ev.category]||'📌'} ${ev.title} <span class="badge cat" style="margin-right:6px;">${ev.category}</span></div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:3px;">${ev.desc}</div>
            </div>
          `).join('') : (isBranch ? '' : `<div class="empty-state">אין אירועים ביום זה.</div>`)}
          ${isBranch ? `
            <div style="margin-top:${selectedEvents.length?'10px':'0'};">
              ${selectedNotes.length ? selectedNotes.map(n=>{
                const color = n.color || '#DADADA';
                return `
                <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:6px;background:${color}55;">
                  <div style="flex:1;font-size:13px;">${n.text}</div>
                  <button class="icon-btn" style="width:auto;padding:3px 8px;font-size:11px;" title="הוספה ליומן Google" onclick="openGoogleCalendarForNote('${n.id}')">📅</button>
                  <button class="icon-btn" style="width:auto;padding:3px 8px;font-size:11px;" onclick="deleteBranchCalendarNote('${n.id}')">🗑</button>
                </div>`;
              }).join('') : `<div class="empty-state" style="padding:6px 0;">אין תזכורות אישיות ביום זה.</div>`}
              <button class="icon-btn" style="width:100%;margin-top:4px;font-size:12.5px;" onclick="openBranchCalendarNoteForm('${selectedDateKey}')">+ הוספת תזכורת</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

    });

}
function myCalendarEventsByDay(items, year, month){
  const byDay = {};
  items.forEach(function(it){
    const startTs = parseHebDate(it.date);
    const endTs = it.endDate ? parseHebDate(it.endDate) : startTs;
    if(isNaN(startTs)) return;
    for(let t=startTs; t<=endTs; t+=86400000){
      const d = new Date(t);
      if(d.getFullYear()===year && d.getMonth()===month){
        const key = d.getDate();
        if(!byDay[key]) byDay[key]=[];
        byDay[key].push(it);
      }
    }
  });
  return byDay;
}
function shiftMyCalendarMonth(delta){
  ui.calMonth += delta;
  if(ui.calMonth<0){ ui.calMonth=11; ui.calYear--; }
  if(ui.calMonth>11){ ui.calMonth=0; ui.calYear++; }
  ui.calSelectedDay = null;
  renderContent();
}

/* ---------- Performance ---------- */
/* ---------- Area manager overview ("האזור שלי") ----------
   נבנה מנתוני התחרויות האמיתיים (appData.competitions) — אין צורך במאגר נפרד.
   כל סניף בתחרות כבר נושא שדה areaManager (שם מלא, למשל "שחר ירושלמי");
   אנו מקבצים לפי המילה הראשונה בשם (התואמת לשמות הקצרים ששולחים אליהם
   הזמנות ההתחברות — "שחר", "נתי" וכו'). */
function areaFirstName(full){
  return (full||'').trim().split(' ')[0] || 'לא ידוע';
}
function computeAreaStats(){
  const map = {};
  appData.competitions.forEach(c=>{
    (c.groups||[]).forEach(g=>{
      (g.branches||[]).forEach(b=>{
        const area = areaFirstName(b.areaManager);
        if(!map[area]) map[area] = {area, target:0, sales:0, branches:[]};
        map[area].target += (b.target||0);
        map[area].sales += (b.sales||0);
        map[area].branches.push({name:b.name, target:b.target||0, sales:b.sales||0, competitionTitle:c.title});
      });
    });
  });
  return Object.values(map);
}
function viewAreaOverview(){
  const stats = computeAreaStats();
  if(!stats.length){
    return `
      <div class="page-head">
        <h1>${session.areaName ? `האזור שלי · ${session.areaLabel}` : `${session.areaLabel} · תצוגה ארצית`}</h1>
        <p>נתוני ביצועים יופיעו כאן ברגע שתהיה תחרות פעילה עם יעדים לסניפים.</p>
      </div>
      <div class="card"><div class="empty-state">עדיין אין נתוני תחרויות להצגה.</div></div>
    `;
  }
  stats.forEach(s=>{ s.pct = s.target>0 ? Math.round(s.sales/s.target*100) : 0; });
  stats.sort((a,b)=>b.pct-a.pct);
  const myArea = session.areaName;
  const myStats = myArea ? stats.find(s=>s.area===myArea) : null;
  const maxPct = Math.max(...stats.map(s=>s.pct), 1);

  const summaryHtml = myStats ? `
    <div class="stat-row">
      <div class="stat-tile"><div class="label">יעד כולל לאזור שלי</div><div class="value" dir="ltr">${fmtMoney(myStats.target)} ₪</div><div class="delta flat">${myStats.branches.length} סניפים</div></div>

/* ---------- Comments / feedback ---------- */
function getComments(itemType, itemId){
  return appData.comments.filter(c=>c.itemType===itemType && c.itemId==itemId);
}
function findItemTitle(itemType, itemId){
  if(itemType==='competitionGroup'){
    const [compId, groupNum] = itemId.split('::');
    const comp = appData.competitions.find(x=>x.id==compId);
    return comp ? `${comp.title} · קבוצה ${groupNum}` : '(פריט נמחק)';
  }
  const src = itemType==='instruction' ? appData.instructions : appData.competitions;
  const item = src.find(x=>x.id==itemId);
  return item ? item.title : '(פריט נמחק)';
}
/* המחלקה שאליה שייך פריט תוכן — לצורך ניתוב שאלות למחלקה הנכונה.
   נופל חזרה ל'marketing' לכל תוכן קיים שאין עליו שדה department. */
function itemDepartmentByRef(itemType, itemId){
  if(itemType==='competitionGroup'){
    const [compId] = itemId.split('::');
    return itemDepartment(appData.competitions.find(x=>x.id==compId));
  }
  const src = itemType==='instruction' ? appData.instructions : appData.competitions;
  return itemDepartment(src.find(x=>x.id==itemId));
}

   (בעבר תמך רק בסניפים, כי session.branchName הוא null עבור מנהלי אזור). */

function toggleComments(itemType, itemId){
  const boxId = `comments-${itemType}-${itemId}`;
  const el = document.getElementById('ct-'+boxId);
  const arrow = document.getElementById('ct-arrow-'+boxId);
  el.classList.toggle('open');
  arrow.textContent = el.classList.contains('open') ? '▴' : '▾';
}
function submitComment(itemType, itemId, boxId){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const input = document.getElementById('comment-input-'+boxId);
  const text = input.value.trim();
  if(!text){ toast('נא לכתוב תוכן לפני השליחה'); input.focus(); return; }
  const commentObj = {
    itemType, itemId,
    branchName: session.role==='marketing' ? 'מחלקת שיווק' : (session.role==='area' ? `מנהל אזור · ${session.areaLabel}` : session.branchName),
    authorEmail: currentUserEmail || '',
    text,
    date: todayHeb()
  };
  if(firebaseReady){
    input.value = '';
    commentObj.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    db.collection('comments').add(commentObj)
      .then(()=>toast('התגובה נשלחה בהצלחה'))
      .catch(err=>toast('שגיאה בשליחת התגובה: '+err.message));
    return;
  }
  commentObj.id = nextIds.comments++;
  appData.comments.push(commentObj);
  const wrap = document.getElementById('cbox-'+boxId);
  if(wrap){ wrap.outerHTML = commentsBox(itemType, itemId, true); } else { renderContent(); }
  toast('התגובה נשלחה בהצלחה');
}

let pendingDeleteComment = null;
function confirmDeleteComment(itemType, itemId, commentId){

  document.getElementById('modal-body').innerHTML = `
    <h3>מחיקת תגובה</h3>
    <p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;">האם למחוק את התגובה? הפעולה תשפיע מיידית על התצוגה בכל הסניפים.</p>

function doDeleteComment(){
  const {itemType, itemId, commentId} = pendingDeleteComment;
  closeModal();
  if(firebaseReady){
    db.collection('comments').doc(commentId).delete()
      .then(()=>toast('התגובה נמחקה'))
      .catch(err=>toast('שגיאה במחיקת התגובה: '+err.message));

  }

function buildMailtoForMessage(itemTitle, branchName, text){
  const subject = itemTitle || 'הודעה מה-HUB';
  const body = `שם הסניף ממנו נשלחה ההודעה: ${branchName}\n\nתוכן ההודעה:\n${text}`;
  return `mailto:${MARKETING_CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function openMailDraft(mailtoUrl){
  // Uses a throwaway <a> click (rather than window.location) since it behaves more
  // consistently across browsers/embedded previews for handing off to a mailto: handler.
  // This can only OPEN a pre-filled compose window — it never sends anything by itself,
  // and if the browser/device has no mail client configured, nothing visible will happen here
  // (the in-app save above still succeeded regardless).
  try{
    const a = document.createElement('a');
    a.href = mailtoUrl;
    a.style.position = 'fixed';
    a.style.opacity = '0';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(), 0);
  }catch(e){
    console.warn('פתיחת טיוטת המייל נכשלה (ייתכן שאין תוכנת מייל מוגדרת בדפדפן/במכשיר):', e);
  }
}
/* ---------- הודעה פרטית — חלון ייעודי נפרד לגמרי מתיבת התגובה הציבורית ----------
   כדי שלא יהיה שום סיכוי שהודעה שנועדה רק למחלקת השיווק "תיפול בטעות" לקיר
   הציבורי, השליחה נעשית דרך מודל (modal) עצמאי עם שדה טקסט וכפתור שליחה משלו,
   ולא דרך אותה תיבת קלט המשמשת גם לתגובה הציבורית. */
function openPrivateMessageModal(itemType, itemId){
  const itemTitle = findItemTitle(itemType, itemId);
  document.getElementById('modal-body').innerHTML = `
    <h3>🔒 הודעה פרטית ל${MARKETING_CONTACT_NAME}</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">
      בנוגע ל"${itemTitle}". ההודעה תוצג רק ל${MARKETING_CONTACT_NAME} (מחלקת שיווק) — לא לסניפים אחרים.
    </p>
    <div class="field">
      <label>תוכן ההודעה</label>
      <textarea id="private-msg-text" rows="5" placeholder="כתבו כאן את ההודעה הפרטית שלכם…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn-confirm" onclick="submitPrivateMessageFromModal('${itemType}','${itemId}')">🔒 שליחת הודעה פרטית</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}
function submitPrivateMessageFromModal(itemType, itemId){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const input = document.getElementById('private-msg-text');
  const text = input.value.trim();
  if(!text){ toast('נא לכתוב תוכן לפני השליחה'); input.focus(); return; }
  const itemTitle = findItemTitle(itemType, itemId);
  /* נמען מחלקתי: השאלה מנותבת למחלקה שמחזיקה את הפריט שעליו שואלים. כל התוכן
     הקיים הוא של שיווק, ולכן היום כל ההודעות ממשיכות להגיע לענבר בדיוק כמו
     קודם — אבל כשתפעול או רכש יפרסמו תוכן, השאלות עליו ינותבו אליהם. */
  const toDepartment = itemDepartmentByRef(itemType, itemId);
  const msgObj = {
    itemType, itemId, itemTitle,
    toDepartment,
    branchName: currentSenderName(),
    branchEmail: session.branchInfo ? session.branchInfo.email : '',
    senderRole: session.role,
    text,
    date: todayHeb(),
    replies: [],
    unreadForMarketing: true,
    unreadForBranch: false,
    deletedForBranch: false,
    deletedForMarketing: false
  };
  closeModal();
  if(firebaseReady){
    msgObj.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    db.collection('privateMessages').add(msgObj)
      .then(()=>{
        toast(`ההודעה נשלחה בהצלחה ל${MARKETING_CONTACT_NAME} · נשלח גם מייל אוטומטי`);
        sendPrivateMessageEmail(currentSenderName(), itemTitle, text);
      })
      .catch(err=>toast('שגיאה בשליחת ההודעה: '+err.message));
    return;
  }
  msgObj.id = nextIds.privateMessages++;
  appData.privateMessages.push(msgObj);
  addNotification({
    id: Date.now(),
    title: 'התקבלה הודעה פרטית חדשה',
    body: `${currentSenderName()} · ${itemTitle}: ${text.slice(0,60)}${text.length>60?'…':''}`,
    date: todayHeb(), type:'message', read:false
  });
  renderContent();
  renderNotifPanel();
  toast(`ההודעה נשלחה בהצלחה ל${MARKETING_CONTACT_NAME} · נשלח גם מייל אוטומטי`);
  sendPrivateMessageEmail(currentSenderName(), itemTitle, text);
}

/* ---------- Private messages inbox ("ההודעות שלי") ---------- */
function viewMessages(){
  if(session.role==='marketing'){
    /* כל מחלקה רואה רק הודעות שמופנות אליה (toDepartment) — הודעה שנוצרה
       לפני שהמנגנון הזה נבנה תיפול תמיד ל-marketing (ברירת המחדל). */
    const list = [...appData.privateMessages]
      .filter(m=>!m.deletedForMarketing && canManageDepartment(m.toDepartment))
      .sort((a,b)=>parseHebDate(b.date)-parseHebDate(a.date));

let pendingDeleteMessageThread = null;
function confirmDeleteMessageThread(msgId){
  pendingDeleteMessageThread = msgId;
  document.getElementById('modal-body').innerHTML = `
    <h3>מחיקת שיחה</h3>
    <p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;">השיחה תוסר מהתצוגה שלכם בלבד — הצד השני עדיין יראה אותה, אלא אם גם הוא ימחק אותה מצדו.</p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn-confirm btn-danger" onclick="doDeleteMessageThread()">מחיקה</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}
function doDeleteMessageThread(){
  const msgId = pendingDeleteMessageThread;
  closeModal();
  const m = appData.privateMessages.find(x=>x.id==msgId);
  const iAmMarketing = session.role==='marketing';
  const otherSideAlreadyDeleted = m && (iAmMarketing ? m.deletedForBranch : m.deletedForMarketing);
  if(firebaseReady){
    if(otherSideAlreadyDeleted){
      db.collection('privateMessages').doc(msgId).delete()
        .then(()=>toast('השיחה נמחקה'))
        .catch(err=>toast('שגיאה במחיקת השיחה: '+err.message));
    } else {
      const field = iAmMarketing ? 'deletedForMarketing' : 'deletedForBranch';
      db.collection('privateMessages').doc(msgId).update({[field]: true})
        .then(()=>toast('השיחה נמחקה מהתצוגה שלכם'))
        .catch(err=>toast('שגיאה במחיקת השיחה: '+err.message));
    }
    return;
  }
  if(m){
    if(otherSideAlreadyDeleted){
      appData.privateMessages = appData.privateMessages.filter(x=>x.id!=msgId);
    } else {
      if(iAmMarketing) m.deletedForMarketing = true; else m.deletedForBranch = true;
    }
  }
  renderContent();
  toast('השיחה נמחקה מהתצוגה שלכם');
}
function submitMessageReply(msgId, boxId){
  const input = document.getElementById('reply-input-'+boxId);
  const text = input.value.trim();
  if(!text){ toast('נא לכתוב תוכן לפני השליחה'); input.focus(); return; }
  const m = appData.privateMessages.find(x=>x.id==msgId);
  if(!m) return;
  const from = session.role==='marketing' ? 'marketing' : 'branch';
  const reply = {from, text, date: todayHeb()};
  input.value = '';
  if(firebaseReady){
    const update = { replies: firebase.firestore.FieldValue.arrayUnion(reply) };
    if(from==='marketing') update.unreadForBranch = true; else update.unreadForMarketing = true;
    db.collection('privateMessages').doc(msgId).update(update)
      .then(()=>toast('התשובה נשלחה בהצלחה'))
      .catch(err=>toast('שגיאה בשליחת התשובה: '+err.message));
    return;
  }
  m.replies.push(reply);
  if(from==='marketing'){ m.unreadForBranch = true; }
  else { m.unreadForMarketing = true; }
  addNotification({
    id: Date.now(),
    title: from==='marketing' ? `${MARKETING_CONTACT_NAME} השיבה להודעה שלכם` : 'התקבלה תגובה חדשה מסניף',
    body: from==='marketing' ? `בנוגע ל"${m.itemTitle}": ${text.slice(0,60)}${text.length>60?'…':''}` : `${m.branchName}: ${text.slice(0,60)}${text.length>60?'…':''}`,
    date: todayHeb(), type:'message', read:false
  });
  renderContent();
  renderNotifPanel();
  toast('התשובה נשלחה בהצלחה');
}

/* ---------- Stands ("סטנדים לאישור") ----------
   Marketing uploads an Excel where SOME branch-name cells are highlighted in color;
   per Inbar's workflow, each distinct color marks a different brand/stand campaign.
   We scan every sheet in the workbook, and for every colored cell whose text matches a
   real branch (via the same normalizeBranchName/branchMatchScore matching already used
   for competitions — this avoids needing to hand-detect header/manager rows: a manager's
   name simply won't match any branch and gets skipped), we record it. Cells are grouped
   by color for review; Inbar labels each color with a brand name and enters ONE takedown
   date for the whole upload (her choice — she uploads per removal-date wave). Two separate
   reminders (10 days before, and 1 day before) are then checked periodically. */
/* Some branches are referred to in marketing spreadsheets by a colloquial/street name
   that differs from their canonical name in BRANCH_DIRECTORY (e.g. the "תל אביב" branch,
   whose address is "אבן גבירול 58", is consistently referred to as "אבן גבירול" in stand
   tracking sheets — matching the naming convention used for its sibling Tel-Aviv branches,
   which ARE named after their street: בוגרשוב, דיזנגוף, פלורנטין, שינקין, שרונה, חשמונאים).
   Add entries here (normalized alias -> canonical branch name) as such cases surface,
   rather than doing broad address-based fuzzy matching, which would risk false matches on
   generic address words ("ביג", "מרכז", etc.) shared across many branches. */
const STAND_BRANCH_ALIASES = { 'אבן גבירול':'תל אביב' };
function matchDirectoryBranch(rawName){
  const target = normalizeBranchName(rawName);
  if(!target) return null;
  const aliasTarget = STAND_BRANCH_ALIASES[target];
  if(aliasTarget){
    const aliased = BRANCH_DIRECTORY.find(b=>normalizeBranchName(b.name)===normalizeBranchName(aliasTarget));
    if(aliased) return aliased;
  }
  for(const b of BRANCH_DIRECTORY){ if(normalizeBranchName(b.name)===target) return b; }
  let best=null, bestScore=Infinity;
  for(const b of BRANCH_DIRECTORY){
    const score = branchMatchScore(target, normalizeBranchName(b.name));
    if(score<bestScore){ bestScore=score; best=b; }
  }
  return (best && bestScore<3.2) ? best : null;
}
/* Campaign grouping key: sheet name + color (NOT color alone). Inspecting Inbar's real
   workbook showed only ~5 distinct highlight colors reused across 13 different product
   sheets (e.g. the same orange marks branches in both the "לבידו" sheet and the unrelated
   "אקוסאפ" sheet) — grouping by color alone would silently merge stands from different,
   unrelated products into one campaign. The sheet name (which IS the real product/period
   identifier, e.g. "סטנדים אקוסאפ 7-12.26") is a much safer grouping key; color within a
   sheet still splits into separate sub-groups, in case a sheet marks more than one wave. */
function cleanSheetLabel(sheetName){
  return (sheetName||'').toString().replace(/^\s*סטנדים\s*/,'').trim() || (sheetName||'').toString().trim();
}
function parseStandsWorkbook(wb){
  const matched = [];
  let unmatchedCount = 0;
  wb.SheetNames.forEach(sheetName=>{
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
    rows.forEach((row, ri)=>{
      if(!row) return;
      row.forEach((val, ci)=>{
        const text = (val||'').toString().trim();
        if(!text) return;
        const hex = cellFillHex(sheet, ri, ci);
        if(!hex || hex==='#FFFFFF') return;
        const m = matchDirectoryBranch(text);
        if(m) matched.push({colorHex:hex, rawName:text, matchedBranch:m, sheetName});
        else unmatchedCount++;
      });
    });
  });
  return {matched, unmatchedCount};
}
let pendingStandsGroups = null;
function triggerStandsImport(){ document.getElementById('stands-file-input').click(); }
function handleStandImageChange(evt, idx){
  const file = evt.target.files[0];
  if(!file) return;
  if(!file.type || file.type.indexOf('image/')!==0){ toast('נא לבחור קובץ תמונה (PNG / JPG)'); evt.target.value=''; return; }
  const statusEl = document.getElementById('stand-image-status-'+idx);
  if(statusEl) statusEl.textContent = '⏳ מעלה את התמונה...';
  uploadFileToCloudinary(file).then(function(result){
    if(pendingStandsGroups && pendingStandsGroups[idx]) pendingStandsGroups[idx].imageUrl = result.secure_url;
    if(statusEl) statusEl.innerHTML = '✅ הועלה בהצלחה';
  }).catch(function(err){
    console.error(err);
    if(statusEl) statusEl.textContent = '❌ ההעלאה נכשלה: ' + err.message;
    toast('שגיאה בהעלאת התמונה');
  });
}
function handleStandsFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellStyles:true});
      const {matched, unmatchedCount} = parseStandsWorkbook(wb);
      if(!matched.length){
        toast('לא זוהו תאים צבועים עם שמות סניפים מזוהים בקובץ.');
        return;
      }
      openStandsReview(matched, unmatchedCount);
    }catch(err){
      console.error(err);
      toast('שגיאה בקריאת קובץ הסטנדים.');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}
function openStandsReview(matched, unmatchedCount){
  const groups = {};
  const order = [];
  matched.forEach(it=>{
    const key = it.sheetName + '||' + it.colorHex;
    if(!groups[key]){ groups[key] = { key, sheetName: it.sheetName, colorHex: it.colorHex, branchMap: new Map() }; order.push(key); }
    const g = groups[key];
    if(!g.branchMap.has(it.matchedBranch.name)) g.branchMap.set(it.matchedBranch.name, { matchedBranch: it.matchedBranch, sheets: new Set() });
    g.branchMap.get(it.matchedBranch.name).sheets.add(it.sheetName);
  });
  pendingStandsGroups = order.map(k=>groups[k]);
  // when a single sheet contains more than one highlight color, disambiguate the
  // pre-filled labels ("לבידו 11-12.26 · קבוצה 1/2/...") instead of repeating the same one
  const sheetCounts = {};
  pendingStandsGroups.forEach(g=>{ sheetCounts[g.sheetName] = (sheetCounts[g.sheetName]||0) + 1; });
  const sheetSeen = {};
  pendingStandsGroups.forEach(g=>{
    const base = cleanSheetLabel(g.sheetName);
    if(sheetCounts[g.sheetName] > 1){
      sheetSeen[g.sheetName] = (sheetSeen[g.sheetName]||0) + 1;
      g.defaultLabel = `${base} · קבוצה ${sheetSeen[g.sheetName]}`;
    } else {
      g.defaultLabel = base;
    }
  });
  const totalBranchEntries = matched.length;
  const sheetCount = new Set(pendingStandsGroups.map(g=>g.sheetName)).size;
  document.getElementById('modal-body').innerHTML = `
    <h3>ייבוא סטנדים מאקסל</h3>
    <p style="font-size:12.5px;color:var(--text-secondary);margin:0 0 12px;">זוהו ${totalBranchEntries} סימוני סניפים על פני ${sheetCount} גיליונות בקובץ, שחולקו ל-${pendingStandsGroups.length} קמפיינים (לפי גיליון, ולפי צבע כשיש יותר מצבע אחד באותו גיליון). אשרו/ערכו את שם כל קמפיין.</p>
    ${unmatchedCount ? `<div class="import-warn">בנוסף אותרו ${unmatchedCount} תאים צבועים נוספים שלא זוהו כשמות סניפים (כנראה כותרות/שמות מנהלי אזור בקובץ) — ניתן להתעלם, אך אם חלקם כן סניפים כדאי לבדוק ידנית.</div>` : ''}
    ${pendingStandsGroups.map((g,idx)=>{
      const branches = Array.from(g.branchMap.keys());
      return `
      <div class="import-summary-group stand-group-row">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span class="stand-color-dot" style="background:${g.colorHex};"></span>
          <input type="text" id="stand-label-${idx}" value="${g.defaultLabel.replace(/"/g,'&quot;')}" placeholder="שם המותג/הסטנד" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--gridline);font-size:13px;">
          <span style="font-size:11.5px;color:var(--muted);flex:none;">${branches.length} סניפים</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted);margin-bottom:4px;">מתוך גיליון "${g.sheetName}"</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;">${branches.join(', ')}</div>
        <div class="field" style="margin-bottom:8px;">
          <label style="font-size:12px;">טקסט מצד מחלקת השיווק (אופציונלי)</label>
          <textarea id="stand-text-${idx}" rows="2" style="font-size:13px;" placeholder="הנחיות/הערות שיוצגו לסניפים...">${g.marketingText||''}</textarea>
        </div>
        <div class="field">
          <label style="font-size:12px;">תמונה להמחשה (אופציונלי)</label>
          <button type="button" class="btn-import" onclick="document.getElementById('stand-image-input-${idx}').click()">🖼 בחירת תמונה</button>
          <input type="file" id="stand-image-input-${idx}" accept="image/*" style="display:none;" onchange="handleStandImageChange(event, ${idx})">
          <div class="field-hint" id="stand-image-status-${idx}"></div>
        </div>
      </div>`;
    }).join('')}
    <div class="field" style="margin-top:14px;">
      <label>תאריך עליית הסטנד (אופציונלי, חל על כל הקמפיינים בייבוא זה)</label>
      <input id="stands-install-date" placeholder="DD.MM.YYYY">
    </div>
    <div class="field">
      <label>תאריך הורדת הסטנד (חל על כל הקמפיינים בייבוא זה)</label>
      <input id="stands-takedown-date" placeholder="DD.MM.YYYY">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
      <button class="btn-confirm" onclick="saveStandsImport()">יצירת קמפיינים ושליחת התראות</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}
function saveStandsImport(){
  const takedownDate = val('stands-takedown-date');
  if(!/^\d{2}\.\d{2}\.\d{4}$/.test(takedownDate)){
    toast('נא להזין תאריך הורדה תקין בפורמט DD.MM.YYYY');
    return;
  }
  const installDateRaw = val('stands-install-date');
  if(installDateRaw && !/^\d{2}\.\d{2}\.\d{4}$/.test(installDateRaw)){
    toast('נא להזין תאריך עלייה תקין בפורמט DD.MM.YYYY, או להשאיר ריק');
    return;
  }
  const installDate = installDateRaw || null;
  if(!pendingStandsGroups || !pendingStandsGroups.length){ closeModal(); return; }
  let missingLabel = false;
  const newCampaigns = [];
  pendingStandsGroups.forEach((g,idx)=>{
    const inputEl = document.getElementById('stand-label-'+idx);
    const label = inputEl ? inputEl.value.trim() : '';
    if(!label){ missingLabel = true; return; }
    const textEl = document.getElementById('stand-text-'+idx);
    const marketingText = textEl ? textEl.value.trim() : '';
    const branches = Array.from(g.branchMap.values()).map(v=>({
      matchedBranchName: v.matchedBranch.name,
      matchedBranchEmail: v.matchedBranch.email,
      areaManager: v.matchedBranch.area || '',
      sourceSheets: Array.from(v.sheets),
      confirmed: false,
      confirmedAt: null
    }));
    newCampaigns.push({
      id: nextIds.standCampaigns++,
      label, colorHex: g.colorHex, sourceSheet: g.sheetName, takedownDate, installDate,
      marketingText: marketingText || null, imageUrl: g.imageUrl || null,
      createdAt: todayHeb(),
      reminder5Sent: false, reminder3Sent: false,
      branches
    });
  });
  if(missingLabel){
    toast('נא למלא שם מותג/סטנד עבור כל קמפיין לפני השמירה');
    return;
  }
  pendingStandsGroups = null;
  closeModal();
  if(firebaseReady){
    const batch = db.batch();
    newCampaigns.forEach(camp=>{
      const ref = db.collection('standCampaigns').doc();
      const {id, ...campData} = camp;
      campData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      batch.set(ref, campData);
    });
    batch.commit()
      .then(()=>{
        const totalBranchesAffected = newCampaigns.reduce((s,c)=>s+c.branches.length,0);
        toast(`נוצרו ${newCampaigns.length} קמפיינים חדשים · ${totalBranchesAffected} סניפים סומנו לאישור.`);
      })
      .catch(err=>toast('שגיאה בשמירת הקמפיינים: '+err.message));
    return;
  }
  newCampaigns.forEach(camp=>{
    appData.standCampaigns.push(camp);
    addNotification({
      id: Date.now() + camp.id,
      title: 'יש לאשר את הסטנד',
      body: `${camp.label} — ${camp.branches.length} סניפים סומנו לאישור הצבה, עד ${camp.takedownDate}.`,
      date: todayHeb(), type:'stand', read:false
    });
  });
  renderContent();
  renderNotifPanel();
  const totalBranchesAffected = newCampaigns.reduce((s,c)=>s+c.branches.length,0);
  toast(`נוצרו ${newCampaigns.length} קמפיינים חדשים · ${totalBranchesAffected} סניפים סומנו לאישור.`);
}

let pendingEditStandImageUrl = undefined;
function openEditStandModal(campId){
  const camp = appData.standCampaigns.find(c=>c.id==campId);
  if(!camp) return;
  pendingEditStandImageUrl = undefined;
  document.getElementById('modal-body').innerHTML = `
    <h3>עריכת קמפיין סטנד</h3>
    <div class="field"><label>שם המותג/הסטנד</label><input id="edit-stand-label" value="${camp.label.replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>תאריך עלייה (אופציונלי)</label><input id="edit-stand-install" value="${camp.installDate||''}" placeholder="DD.MM.YYYY"></div>
    <div class="field"><label>תאריך הורדה</label><input id="edit-stand-takedown" value="${camp.takedownDate||''}" placeholder="DD.MM.YYYY"></div>
    <div class="field"><label>טקסט מצד מחלקת השיווק</label><textarea id="edit-stand-text" rows="3">${camp.marketingText||''}</textarea></div>
    <div class="field">
      <label>תמונה להמחשה</label>
      ${camp.imageUrl ? `<div style="margin-bottom:8px;"><img src="${camp.imageUrl}" style="max-width:100%;max-height:160px;border-radius:8px;"></div>` : ''}
      <button type="button" class="btn-import" onclick="document.getElementById('edit-stand-image-input').click()">🖼 ${camp.imageUrl ? 'החלפת תמונה' : 'בחירת תמונה'}</button>
      <input type="file" id="edit-stand-image-input" accept="image/*" style="display:none;" onchange="handleEditStandImageChange(event)">
      <div class="field-hint" id="edit-stand-image-status"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>

  `;

}
function handleEditStandImageChange(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(!file.type || file.type.indexOf('image/')!==0){ toast('נא לבחור קובץ תמונה (PNG / JPG)'); evt.target.value=''; return; }
  const statusEl = document.getElementById('edit-stand-image-status');
  if(statusEl) statusEl.textContent = '⏳ מעלה את התמונה...';
  uploadFileToCloudinary(file).then(function(result){
    pendingEditStandImageUrl = result.secure_url;
    if(statusEl) statusEl.innerHTML = '✅ הועלה בהצלחה';
  }).catch(function(err){
    console.error(err);
    if(statusEl) statusEl.textContent = '❌ ההעלאה נכשלה: ' + err.message;
    toast('שגיאה בהעלאת התמונה');
  });
}
function saveEditStand(campId){
  const camp = appData.standCampaigns.find(c=>c.id==campId);
  if(!camp) return;
  const label = val('edit-stand-label');
  const installDate = val('edit-stand-install');
  const takedownDate = val('edit-stand-takedown');
  if(!label){ toast('נא למלא שם מותג/סטנד'); return; }
  if(!/^\d{2}\.\d{2}\.\d{4}$/.test(takedownDate)){ toast('נא להזין תאריך הורדה תקין'); return; }
  if(installDate && !/^\d{2}\.\d{2}\.\d{4}$/.test(installDate)){ toast('נא להזין תאריך עלייה תקין, או להשאיר ריק'); return; }
  const marketingText = val('edit-stand-text');
  const updates = {
    label, installDate: installDate || null, takedownDate,
    marketingText: marketingText || null,
    imageUrl: pendingEditStandImageUrl!==undefined ? pendingEditStandImageUrl : (camp.imageUrl || null)
  };
  Object.assign(camp, updates);
  pendingEditStandImageUrl = undefined;
  closeModal();
  if(firebaseReady){
    db.collection('standCampaigns').doc(campId).update(updates)
      .then(()=>toast('הקמפיין עודכן בהצלחה'))
      .catch(err=>toast('שגיאה בעדכון הקמפיין: '+err.message));
  } else {
    renderContent();
    toast('הקמפיין עודכן בהצלחה');
  }
}
/* אישור סטנד — הסטטוס נשמר כעת במסמך נפרד לכל סניף (standConfirmations), לא במערך משותף
   בתוך הקמפיין. זה מאפשר להגביל בכללי Firestore: רק הסניף עצמו יכול לכתוב לאישור שלו.
   נופל חזרה לשדות confirmed/confirmedAt הישנים על branches[idx] לתאימות עם קמפיינים ישנים. */
function getStandBranchStatus(camp, b){
  const conf = (appData.standConfirmations || []).find(c => c.campaignId === camp.id && c.branchEmail === b.matchedBranchEmail);
  if(conf) return { confirmed: !!conf.confirmed, confirmedAt: conf.confirmedAt || null };
  return { confirmed: !!b.confirmed, confirmedAt: b.confirmedAt || null };
}
function confirmStand(campId, idx){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const camp = appData.standCampaigns.find(c=>c.id==campId);
  if(!camp) return;
  const b = camp.branches[idx];
  if(!b) return;
  if(getStandBranchStatus(camp, b).confirmed) return;
  const confirmedAt = todayHeb();
  if(firebaseReady){
    const confId = campId + '__' + b.matchedBranchEmail;
    db.collection('standConfirmations').doc(confId).set({
      campaignId: campId,
      branchEmail: b.matchedBranchEmail,
      branchName: b.matchedBranchName,
      confirmed: true,
      confirmedAt
    }, {merge:true})
      .then(()=>{
        toast('תודה! האישור נשמר בהצלחה.');
        sendPrivateMessageEmail(b.matchedBranchName, `אישור סטנד: ${camp.label}`, `סניף ${b.matchedBranchName} אישר את סטנד ${camp.label} — הוצב בסניף בהצלחה.`);
      })
      .catch(err=>toast('שגיאה בשמירת האישור: '+err.message));
    return;
  }
  b.confirmed = true;
  b.confirmedAt = confirmedAt;
  addNotification({
    id: Date.now(),
    title: 'סטנד אושר',
    body: `${b.matchedBranchName} אישר/ה שהסטנד "${camp.label}" תקין ומוצב בסניף.`,
    date: todayHeb(), type:'stand', read:false
  });
  renderContent();
  renderNotifPanel();
  toast('תודה! האישור נשמר בהצלחה.');
  sendPrivateMessageEmail(b.matchedBranchName, `אישור סטנד: ${camp.label}`, `סניף ${b.matchedBranchName} אישר את סטנד ${camp.label} — הוצב בסניף בהצלחה.`);
}
/* אישור "ראיתי, אוריד את הסטנד" — תזכורת 3 ימים לפני ההורדה שחובה לאשר.
   כל עוד לא קיים מסמך אישור לצירוף (קמפיין+סניף) הזה, הבאנר ימשיך להופיע —
   זה לא נגזר מ"נקרא" (עיגול אדום) אלא מהיעדר אישור בפועל, כל טעינה מחדש. */
function hasAckedTakedown(campId, branchEmail){
  return (appData.standTakedownAcks||[]).some(a=>a.campaignId===campId && a.branchEmail===branchEmail);
}
function ackStandTakedown(campId){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  if(!session.branchInfo) return;
  const camp = appData.standCampaigns.find(c=>c.id==campId);
  if(!camp) return;
  const branchEmail = session.branchInfo.email;
  const ackedAt = todayHeb() + ' ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  if(hasAckedTakedown(campId, branchEmail)) return;
  const rec = {campaignId: campId, branchEmail, branchName: session.branchName, ackedAt};
  appData.standTakedownAcks.push(rec);
  renderContent();
  toast('תודה, מסומן כנקרא.');
  if(firebaseReady){
    const ackId = campId + '__' + branchEmail;
    db.collection('standTakedownAcks').doc(ackId).set(rec).catch(err=>toast('שגיאה בשמירת האישור: '+err.message));
  }
}
function checkStandReminders(){
  const now = Date.now();
  let any = false;
  appData.standCampaigns.forEach(camp=>{
    const t = parseHebDate(camp.takedownDate);
    if(isNaN(t)) return;
    const daysLeft = (t-now)/86400000;
    /* תזכורת מידעית, חד-פעמית, 5 ימים לפני ההורדה. */
    if(!camp.reminder5Sent && daysLeft<=5 && daysLeft>3){
      camp.reminder5Sent = true;
      if(firebaseReady) db.collection('standCampaigns').doc(camp.id).update({reminder5Sent:true}).catch(()=>{});
      addNotification({
        id: Date.now()+Math.random(),
        title: '🪧 תזכורת: יש להוריד סטנד בקרוב',
        body: `${camp.label} — יש להוריד את הסטנד בעוד כ-5 ימים (${camp.takedownDate}).`,
        date: todayHeb(), type:'stand', read:false
      });
      any = true;
    }
    /* תזכורת דחופה 3 ימים לפני ההורדה — לא חד-פעמית: מוצגת פעם אחת כהתראה בפעמון,
       אבל הבאנר החובה-לאישור ב"סטנדים לאישור" ממשיך להופיע כל עוד לא אושר בפועל
       (ראו hasAckedTakedown/ackStandTakedown), ללא תלות בשדה הזה. */
    if(!camp.reminder3Sent && daysLeft<=3 && daysLeft>=-3){
      camp.reminder3Sent = true;
      if(firebaseReady) db.collection('standCampaigns').doc(camp.id).update({reminder3Sent:true}).catch(()=>{});
      addNotification({
        id: Date.now()+Math.random(),
        title: '⏰ תזכורת דחופה: להוריד סטנד — נדרש אישור',
        body: `${camp.label} — יש להוריד את הסטנד עד ${camp.takedownDate}. יש לאשר קבלת התזכורת במסך "סטנדים לאישור".`,
        date: todayHeb(), type:'stand', read:false
      });
      any = true;
    }
  });
  if(any) renderNotifPanel();
}
function viewStands(){
  return session.role==='marketing' ? viewStandsMarketing() : viewStandsBranch();
}

      ${pending ? `<button class="stand-confirm-btn" onclick="confirmStand('${camp.id}',${idx})">✅ אשר שהסטנד תקין ומוצב בסניף</button>` : `<div class="field-hint">אושר בתאריך ${confirmedAt}</div>`}

/* ---------- מכר מבצעים (רכש) ---------- */
/* בחירת סניפים להשוואה — גלובלית לכל המוצרים (לא נבחרת מחדש בכל מוצר),
   נשמרת ב-localStorage לפי זהות הצופה, כפי שהוחלט בשיחה. */
function promoCompareKey(){
  const vid = (typeof currentPushIdentity==='function' && currentPushIdentity()) || 'anon';
  return 'nizatHubPromoCompare_' + vid.replace(/[^a-zA-Z0-9:_@.-]/g,'_');
}
function getPromoCompareBranches(){
  try{ return JSON.parse(localStorage.getItem(promoCompareKey())||'[]'); }catch(e){ return []; }
}
function savePromoCompareBranches(arr){
  try{ localStorage.setItem(promoCompareKey(), JSON.stringify(arr)); }catch(e){}
}
function removePromoCompareBranch(name){
  savePromoCompareBranches(getPromoCompareBranches().filter(n=>n!==name));
  renderContent();
}
function openPromoComparePicker(){
  const current = getPromoCompareBranches();
  document.getElementById('modal-body').innerHTML = `
    <h3>הוספת סניף להשוואה</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin:4px 0 12px;">הבחירה חלה על כל המוצרים ברשימה.</p>
    <div id="promo-pick-list" style="max-height:360px;overflow-y:auto;">טוען סניפים…</div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">סגירה</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  loadBranchDirectory().then(function(){
    const listEl = document.getElementById('promo-pick-list');
    if(!listEl) return;
    const rows = BRANCH_DIRECTORY.slice().sort((a,b)=>a.name.localeCompare(b.name,'he'))
      .filter(b=>current.indexOf(b.name)===-1)
      .map(b=>`<div class="preview-pick-row" onclick="addPromoCompareBranch('${b.name.replace(/'/g,"\\'")}')"><span>${b.name}</span></div>`)
      .join('');
    listEl.innerHTML = rows || '<div class="empty-state">כל הסניפים כבר נבחרו.</div>';
  });
}
function addPromoCompareBranch(name){
  const current = getPromoCompareBranches();
  if(current.indexOf(name)===-1) savePromoCompareBranches([...current, name]);
  closeModal();
  renderContent();
}
/* בחירת אזורים להשוואה (למנהלי אזור) - אותו רעיון בדיוק כמו בחירת סניפים,
   רק שהיחידה היא אזור שלם ולא סניף בודד. */
function promoCompareAreasKey(){
  const vid = (typeof currentPushIdentity==='function' && currentPushIdentity()) || 'anon';
  return 'nizatHubPromoCompareAreas_' + vid.replace(/[^a-zA-Z0-9:_@.-]/g,'_');
}
function promoNationalExcludedAreasKey(){
  const vid = (typeof currentPushIdentity==='function' && currentPushIdentity()) || 'anon';
  return 'nizatHubPromoNationalExcluded_' + vid.replace(/[^a-zA-Z0-9:_@.-]/g,'_');
}
function allRealAreaLabels(){
  return Object.keys(AREA_MANAGER_INFO)
    .filter(email=>AREA_MANAGER_INFO[email].areaName!==null)
    .map(email=>AREA_MANAGER_INFO[email].label)
    .sort((a,b)=>a.localeCompare(b,'he'));
}
/* ארבל/עופר (תצוגה ארצית): במקום לשמור "אילו אזורים נבחרו" (רשימת הכללה,
   שמתחילה ריקה וגורמת להם להוסיף כל אזור ידנית), שומרים "אילו אזורים
   הוסרו" (רשימת החרגה). כך ברירת המחדל היא תמיד "כל 6 האזורים", בלי תלות
   עדינה בהאם נשמר משהו בעבר תחת מפתח כלשהו - הרבה יותר עמיד מהגרסה
   הקודמת שניסתה להסתמך על "localStorage ריק = ביקור ראשון". */
function getPromoCompareAreas(){
  if(hasPromoNationalAccess()){
    let excluded;
    try{ excluded = JSON.parse(localStorage.getItem(promoNationalExcludedAreasKey())||'[]'); }catch(e){ excluded = []; }
    return allRealAreaLabels().filter(a=>excluded.indexOf(a)===-1);
  }
  try{ return JSON.parse(localStorage.getItem(promoCompareAreasKey())||'[]'); }catch(e){ return []; }
}
function savePromoCompareAreas(arr){
  try{ localStorage.setItem(promoCompareAreasKey(), JSON.stringify(arr)); }catch(e){}
}
function removePromoCompareArea(area){
  if(hasPromoNationalAccess()){
    let excluded;
    try{ excluded = JSON.parse(localStorage.getItem(promoNationalExcludedAreasKey())||'[]'); }catch(e){ excluded = []; }
    if(excluded.indexOf(area)===-1) excluded.push(area);
    try{ localStorage.setItem(promoNationalExcludedAreasKey(), JSON.stringify(excluded)); }catch(e){}
    renderContent();
    return;
  }
  savePromoCompareAreas(getPromoCompareAreas().filter(a=>a!==area));
  renderContent();
}
function addPromoCompareArea(area){
  if(hasPromoNationalAccess()){
    let excluded;
    try{ excluded = JSON.parse(localStorage.getItem(promoNationalExcludedAreasKey())||'[]'); }catch(e){ excluded = []; }
    excluded = excluded.filter(a=>a!==area);
    try{ localStorage.setItem(promoNationalExcludedAreasKey(), JSON.stringify(excluded)); }catch(e){}
    closeModal();
    renderContent();
    return;
  }
  const current = getPromoCompareAreas();
  if(current.indexOf(area)===-1) savePromoCompareAreas([...current, area]);
  closeModal();
  renderContent();
}
function openPromoCompareAreaPicker(){
  const current = getPromoCompareAreas();
  const allAreas = allRealAreaLabels();
  const rows = allAreas.filter(a=>a!==session.areaLabel && current.indexOf(a)===-1)
    .map(a=>`<div class="preview-pick-row" onclick="addPromoCompareArea('${a.replace(/'/g,"\\'")}')"><span>${a}</span></div>`).join('');
  document.getElementById('modal-body').innerHTML = `
    <h3>הוספת מנהל איזור להשוואה</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin:4px 0 12px;">הבחירה חלה על כל המוצרים ברשימה.</p>
    <div style="max-height:360px;overflow-y:auto;">${rows || '<div class="empty-state">כל מנהלי האיזור כבר נבחרו.</div>'}</div>
    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">סגירה</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}
function isAreaViewer(){ return session.role==='area' && !!session.areaLabel; }
/* עופר וארבל: role='area' עם areaName=null (תצוגה ארצית, לא אזור ספציפי).
   מבחינת "מכר מבצעים" הם לא אמורים לרדת לרמת סניף בודד, אלא לראות תמונה
   ארצית לפי אזורים - זה מה ש-buildPromoNationalReport נותן. */
function isNationalViewer(){ return session.role==='area' && !!session.areaLabel && !session.areaName; }
/* אנשי צוות ספציפיים (רכש/שיווק) שצריכים לראות בדיוק את אותה תצוגה ארצית
   של ארבל/עופר במודול "מכר מבצעים" - גם אם ה-role שלהם הוא 'marketing'
   ואין להם session.areaLabel כלל. רשימה סגורה של מיילים, לא כל מי
   שבמחלקת שיווק/רכש - כדי לא להעניק את זה בטעות למישהו שלא ביקשו עבורו. */
const PROMO_NATIONAL_ACCESS_EMAILS = [
  'yulia@nizat.co.il', 'tradeo@nizat.co.il', 'nofar@nizat.co.il',
  'edith@nizat.co.il', 'eliran@nizat.co.il'
];
function hasPromoNationalAccess(){
  return isNationalViewer() || (session.role==='marketing' && PROMO_NATIONAL_ACCESS_EMAILS.indexOf(currentUserEmail)!==-1);
}
/* בונה את שורות הנתונים למכר מבצעים לפי שאילתת חיפוש נתונה - ברירת מחדל
   (שאילתה ריקה) ממוינת לפי אלף-בית של כותרת המוצר. */
function buildPromoRows(query){
  const products = [...(appData.promoProducts||[])];
  const areaMode = isAreaViewer() || hasPromoNationalAccess();
  const q = (query||'').trim().toLowerCase();
  return products
    .filter(p => !q || (p.title||'').toLowerCase().includes(q))
    .map(p=>{
      const branches = p.branches || [];
      const med = median(branches.map(b=>b.sales||0)) || 0;
      const mine = computeMyPromoValue(p);
      let rank = null, total = null;
      if(mine){
        if(areaMode){
          const grouped = groupPromoProductByArea(p).sort((a,b)=>b.med-a.med);
          rank = grouped.findIndex(a=>a.area===session.areaLabel) + 1;
          total = grouped.length;
        } else {
          const matched = matchMyBranchInPromoProduct(p, session.branchInfo);
          const sorted = [...branches].sort((a,b)=>b.sales-a.sales);
          rank = matched ? sorted.indexOf(matched)+1 : null;
          total = branches.length;
        }
      }
      return {product: p, med, mine, rank, total};
    })
    .sort((a,b)=> (a.product.title||'').localeCompare(b.product.title||'', 'he'));
}
function renderPromoRowsHtml(rows, hadProducts){
  const areaMode = isAreaViewer() || hasPromoNationalAccess();
  if(!rows.length) return `<div class="card"><div class="empty-state">${hadProducts ? 'לא נמצאו מוצרים תואמים לחיפוש.' : 'עדיין אין נתוני מכר מבצעים.'}</div></div>`;
  return rows.map(r=>promoProductCard(r, areaMode)).join('');
}
/* עדכון קליל של תיבת החיפוש - מעדכן רק את תיבת ההצעות ואת רשימת השורות
   בפועל (DOM ממוקד), בלי לקרוא ל-renderContent המלא. זה מה שמונע מהשדה
   "להיהרס" ולאבד פוקוס באמצע הקלדה/מחיקה, וגם חוסך חישוב מיותר של כל
   118 המוצרים מחדש על כל הקשה. */
function updatePromoSearch(value){
  ui.promoSearchQuery = value;
  const q = value.trim().toLowerCase();
  const suggEl = document.getElementById('promo-suggestions');
  const rowsEl = document.getElementById('promo-rows');
  if(suggEl){
    if(!q){
      suggEl.style.display = 'none';
      suggEl.innerHTML = '';
    } else {
      const matches = [...(appData.promoProducts||[])]
        .filter(p=>(p.title||'').toLowerCase().includes(q))
        .sort((a,b)=>(a.title||'').localeCompare(b.title||'','he'))
        .slice(0,10);
      suggEl.style.display = matches.length ? 'block' : 'none';
      suggEl.innerHTML = matches.map(p=>`
        <div style="padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--gridline);" onclick="selectPromoSuggestion('${(p.title||'').replace(/'/g,"\\'")}')">${p.title}</div>
      `).join('');
    }
  }
  if(rowsEl){
    const rows = buildPromoRows(value);
    rowsEl.innerHTML = renderPromoRowsHtml(rows, (appData.promoProducts||[]).length>0);
  }
}
function selectPromoSuggestion(title){
  const input = document.getElementById('promo-search-input');
  if(input) input.value = title;
  updatePromoSearch(title);
  const suggEl = document.getElementById('promo-suggestions');
  if(suggEl){ suggEl.style.display='none'; suggEl.innerHTML=''; }
}
function clearPromoSearch(){
  const input = document.getElementById('promo-search-input');
  if(input) input.value = '';
  updatePromoSearch('');
}
function setPromoTab(tab){ ui.promoTab = tab; renderContent(); }

    <div class="admin-tabs" style="margin-bottom:16px;">

          ${areaMode ? name : name.replace('ניצת ','')}
          <button style="border:none;background:none;padding:0;cursor:pointer;color:inherit;font-size:13px;line-height:1;" onclick="${areaMode?'removePromoCompareArea':'removePromoCompareBranch'}('${name.replace(/'/g,"\\'")}')">✕</button>
        </span>

      <button class="icon-btn" style="width:auto;padding:4px 10px;font-size:12px;" onclick="${areaMode?'openPromoCompareAreaPicker':'openPromoComparePicker'}()">+ הוספת ${areaMode?'מנהל איזור':'סניף'}</button>
    </div>

function promoProductCard(r, areaMode){
  const p = r.product, mine = r.mine, med = r.med;
  const compareList = areaMode ? getPromoCompareAreas() : getPromoCompareBranches();
  const groupedByArea = areaMode ? groupPromoProductByArea(p) : null;
  const valueForEntity = (name) => {
    if(areaMode){
      const g = groupedByArea.find(a=>a.area===name);
      return g ? Math.round(g.med*10)/10 : 0;
    }
    const b = (p.branches||[]).find(x=>x.name===name);
    return b ? b.sales : 0;
  };
  const maxVal = Math.max(med, mine?mine.sales:0, ...compareList.map(valueForEntity), 1);
  const myPct = mine ? Math.min(100, (mine.sales/maxVal)*100) : 0;
  const barColor = !mine ? 'var(--muted)' : (mine.sales>=med*1.05 ? 'var(--good,#3B6D11)' : (mine.sales>=med*0.85 ? 'var(--blue,#185FA5)' : 'var(--critical,#A32D2D)'));
  const unitLabel = mine ? mine.unitLabel : 'יחידות שנמכרו';
  const mineRowLabel = areaMode ? session.areaLabel : 'הסניף שלכם';
  return `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;">
        <div style="font-weight:500;font-size:15px;">${p.title}</div>
        ${r.rank ? `<span style="font-size:12px;padding:3px 10px;border-radius:8px;background:${barColor==='var(--good,#3B6D11)'?'var(--bg-success,#EAF3DE)':barColor==='var(--critical,#A32D2D)'?'var(--bg-danger,#FCEBEB)':'var(--gridline,#f0f0f0)'};color:${barColor};white-space:nowrap;flex:none;">מקום ${r.rank} מתוך ${r.total}</span>` : ''}
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">חציון הרשת: ${med.toFixed(1)} יחידות</div>
      ${mine ? `
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px;">
          <span style="font-size:22px;font-weight:500;">${mine.sales}</span>
          <span style="font-size:13px;color:var(--text-secondary);">${unitLabel}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${mine.label}</div>
        <div style="position:relative;height:8px;background:var(--gridline,#eee);border-radius:4px;margin-bottom:12px;">
          <div style="position:absolute;right:0;top:0;height:100%;width:${myPct}%;background:${barColor};border-radius:4px;"></div>
        </div>
        ${areaMode ? (function(){
          const branchRows = myAreaBranchBreakdown(p);
          if(!branchRows.length) return '';
          const maxBranchVal = Math.max(...branchRows.map(x=>x.sales), 1);
          return `
          <div style="border-top:1px solid var(--gridline);padding-top:10px;margin-bottom:${compareList.length?'12px':'0'};">
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">פירוט לפי סניף באזור שלכם:</div>
            ${branchRows.map(b=>`
              <div style="display:flex;align-items:center;gap:10px;padding:3px 0;">
                <span style="font-size:12px;width:130px;flex:none;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.name.replace('ניצת ','')}</span>
                <div style="flex:1;height:14px;background:var(--gridline,#eee);border-radius:4px;position:relative;">
                  <div style="height:100%;width:${Math.min(100,(b.sales/maxBranchVal)*100)}%;background:var(--muted);border-radius:4px;"></div>
                </div>
                <span style="font-size:12px;width:28px;text-align:left;color:var(--text-secondary);">${b.sales}</span>
              </div>
            `).join('')}
          </div>`;
        })() : ''}
      ` : `<div style="font-size:12px;color:var(--muted);margin-bottom:${compareList.length?'12px':'0'};">${hasPromoNationalAccess() && compareList.length ? 'השוואה בין מנהלי האזור:' : 'אין נתונים זמינים.'}</div>`}
      ${compareList.length ? `
        <div style="border-top:1px solid var(--gridline);padding-top:10px;">
          ${mine ? `
            <div style="display:flex;align-items:center;gap:10px;padding:4px 0;">
              <span style="font-size:12px;width:110px;flex:none;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${mineRowLabel}</span>
              <div style="flex:1;height:18px;background:var(--gridline,#eee);border-radius:4px;position:relative;">
                <div style="height:100%;width:${myPct}%;background:var(--blue,#185FA5);border-radius:4px;"></div>
              </div>
              <span style="font-size:12px;width:32px;text-align:left;font-weight:500;">${mine.sales}</span>
            </div>
          ` : ''}
          ${compareList.map(name=>{
            const val = valueForEntity(name);
            const pct = Math.min(100, (val/maxVal)*100);
            return `
            <div style="display:flex;align-items:center;gap:10px;padding:4px 0;">
              <span style="font-size:12px;width:110px;flex:none;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${areaMode ? name : name.replace('ניצת ','')}</span>
              <div style="flex:1;height:18px;background:var(--gridline,#eee);border-radius:4px;position:relative;">
                <div style="height:100%;width:${pct}%;background:var(--muted);border-radius:4px;"></div>
              </div>
              <span style="font-size:12px;width:32px;text-align:left;color:var(--text-secondary);">${val}</span>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}
function viewStandsBranch(){
  const myName = session.branchInfo ? session.branchInfo.name : null;
  const myEmail = session.branchInfo ? session.branchInfo.email : null;
  const items = [];
  appData.standCampaigns.forEach(camp=>{
    camp.branches.forEach((b,idx)=>{ if(b.matchedBranchName===myName) items.push({camp, b, idx, status:getStandBranchStatus(camp,b)}); });
  });
  const pending = items.filter(x=>!x.status.confirmed);
  const confirmed = items.filter(x=>x.status.confirmed);
  /* באנר חובה-לאישור: כל קמפיין שנותרו לו 3 ימים או פחות להורדה, ושהסניף הזה
     עדיין לא אישר קבלת התזכורת עבורו — ממשיך להופיע כל עוד לא נלחץ "אישרתי". */
  const now = Date.now();
  const urgentUnacked = items.filter(x=>{
    const t = parseHebDate(x.camp.takedownDate);
    if(isNaN(t)) return false;
    const daysLeft = (t-now)/86400000;
    return daysLeft<=3 && !hasAckedTakedown(x.camp.id, myEmail);
  });
  return `
    <div class="page-head">
      <h1>סטנדים לאישור</h1>
      <p>סטנדים שהוצבו בסניף שלכם וממתינים לאישור שהם תקינים ובמקום.</p>
    </div>
    ${urgentUnacked.map(x=>`
      <div class="card" style="background:rgba(208,59,59,0.06);border:1px solid rgba(208,59,59,0.3);margin-bottom:14px;">
        <div style="display:flex;align-items:flex-start;gap:10px;">
          <span style="font-size:22px;">⏰</span>
          <div style="flex:1;">
            <div style="font-weight:700;color:var(--critical);margin-bottom:4px;">תזכורת דחופה: יש להוריד את הסטנד "${x.camp.label}"</div>
            <div style="font-size:13.5px;color:var(--text-secondary);margin-bottom:10px;">יש להוריד עד <span dir="ltr">${x.camp.takedownDate}</span>. אנא אשרו שראיתם את התזכורת.</div>
            <button class="btn-confirm" onclick="ackStandTakedown('${x.camp.id}')">אישרתי, ראיתי את התזכורת</button>
          </div>
        </div>
      </div>
    `).join('')}
    <div class="card">
      ${pending.length ? pending.map(x=>standCardHtml(x.camp, x.b, x.idx, true)).join('') : '<div class="empty-state">אין סטנדים הממתינים לאישור כרגע. 🎉</div>'}
    </div>
    ${confirmed.length ? `
    <h3 style="font-size:14px;margin:22px 0 10px;color:var(--text-secondary);">אושרו</h3>
    <div class="card">${confirmed.map(x=>standCardHtml(x.camp, x.b, x.idx, false, x.status.confirmedAt)).join('')}</div>` : ''}
  `;
}

            </div>
            <button class="icon-btn" onclick="openEditStandModal('${camp.id}')" title="עריכה">✎</button>
          </div>

          <div class="comp-group-table" id="stand-table-${camp.id}">
            ${camp.branches.map(b=>({ b, status:getStandBranchStatus(camp,b) })).sort((a,b)=>Number(a.status.confirmed)-Number(b.status.confirmed)).map(x=>`
              <div class="comp-group-table-row">
                <span class="n">${x.b.matchedBranchName}</span>
                <span class="m">${x.status.confirmed ? '✅ '+x.status.confirmedAt : '⏳ ממתין'}</span>
              </div>
            `).join('')}
          </div>
        </div>
        `;
      }).join('') || '<div class="empty-state">עדיין לא הועלה קובץ סטנדים. לחצו על "העלאת קובץ סטנדים".</div>'}
    </div>
  `;
}

/* איפוס ידני - מוחק את כל הקולקציה בלי לחכות להעלאת קובץ חדש. שימושי
   כשקובץ שגוי כבר יובא (למשל בעקבות באג פענוח) ורוצים "לוח נקי" לפני
   שמנסים שוב, בלי לחכות לקובץ הבא. דורש אישור מפורש כי זו מחיקה בלתי הפיכה. */
function resetPromoProducts(){
  if(!confirm('למחוק את כל נתוני מכר המבצעים הקיימים? הפעולה בלתי הפיכה - תצטרכו להעלות קובץ אקסל מחדש.')) return;
  const statusEl = document.getElementById('promo-upload-status');
  if(statusEl) statusEl.textContent = 'מוחק נתוני מכר מבצעים...';
  db.collection('promoProducts').get().then(function(snap){
    const delBatches = [];
    let batch = db.batch(); let n=0;
    snap.forEach(function(doc){
      batch.delete(doc.ref); n++;
      if(n===450){ delBatches.push(batch); batch = db.batch(); n=0; }
    });
    if(n>0) delBatches.push(batch);
    return Promise.all(delBatches.map(b=>b.commit()));
  }).then(function(){
    if(statusEl) statusEl.textContent = 'כל נתוני מכר המבצעים נמחקו.';
  }).catch(function(err){
    if(statusEl) statusEl.textContent = 'שגיאה במחיקה: ' + err.message;
  });
}

/* ייבוא חוברת המבצעים - קובץ JSON קטן {codes:{...}} שמופק מהחוברת (ראו
   שיחה נפרדת על פענוח PDF). מחליף לגמרי את הקולקציה promoBooklet. */
function handlePromoBookletUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('promo-booklet-status');
  if(statusEl) statusEl.textContent = 'קורא את קובץ ה-JSON...';
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed!=='object' || !parsed.codes) throw new Error('מבנה קובץ לא תקין - חסר שדה codes');
    }catch(err){
      if(statusEl) statusEl.textContent = 'שגיאה בקריאת הקובץ: ' + err.message;
      return;
    }
    const codes = parsed.codes;
    if(statusEl) statusEl.textContent = `נמחקים ${Object.keys(appData.promoBooklet||{}).length} רשומות ישנות...`;
    db.collection('promoBooklet').get().then(function(snap){
      const delBatches = [];
      let batch = db.batch(); let n=0;
      snap.forEach(function(doc){
        batch.delete(doc.ref); n++;
        if(n===450){ delBatches.push(batch); batch = db.batch(); n=0; }
      });
      if(n>0) delBatches.push(batch);
      return Promise.all(delBatches.map(b=>b.commit()));
    }).then(function(){
      const codeKeys = Object.keys(codes);
      if(statusEl) statusEl.textContent = `כותב ${codeKeys.length} קודי מבצע חדשים...`;
      const writeBatches = [];
      let batch = db.batch(); let n=0;
      codeKeys.forEach(function(code){
        const m = codes[code];
        const ref = db.collection('promoBooklet').doc(code);
        batch.set(ref, {
          template: m.template||null, price: m.price!=null?Number(m.price):null,
          note: m.note||'', section: m.section||null, restricted: m.restricted||null,
          mergedInto: m.mergedInto||null, needsParticipantList: !!m.needsParticipantList,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        n++;
        if(n===450){ writeBatches.push(batch); batch = db.batch(); n=0; }
      });
      if(n>0) writeBatches.push(batch);
      return Promise.all(writeBatches.map(b=>b.commit()));
    }).then(function(){
      if(statusEl) statusEl.textContent = `הועלו ${Object.keys(codes).length} קודי מבצע בהצלחה.`;
    }).catch(function(err){
      if(statusEl) statusEl.textContent = 'שגיאה בשמירה: ' + err.message;
    });
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function handlePromoExcelUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('promo-upload-status');
  if(statusEl) statusEl.textContent = 'קורא את קובץ האקסל...';
  const reader = new FileReader();
  reader.onload = function(e){
    let rows;
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellStyles:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      if(!rows.length) throw new Error('הקובץ ריק');
    }catch(err){
      if(statusEl) statusEl.textContent = 'שגיאה בקריאת הקובץ: ' + err.message;
      return;
    }
    pendingPromoImportRows = rows;
    const headers = rows[0] || [];
    /* עמודות סיכום (למשל "סך הכל"/"סה\"כ") הן לא סניף בשום צורה - יש להוציא
       אותן החוצה כאן, לפני כל ניסיון זיהוי, כדי שלא יגיעו בכלל לרשימת
       "קיצורים לא מוכרים". השוואה סלחנית לגרשיים/מרכאות כדי לתפוס גם
       'סך הכל' וגם 'סה"כ' וגם "סך-הכל". */
    function isTotalsColumnHeader(h){
      const norm = String(h).replace(/["'׳״`]/g,'').replace(/[-–]/g,' ').replace(/\s+/g,' ').trim();
      return norm==='סך הכל' || norm==='סך הכול' || norm==='סהכ' || norm.toLowerCase()==='total';
    }
    const branchCols = [...new Set(headers.slice(3)
      .filter(h=>h!=null && String(h).trim()!=='' && !isTotalsColumnHeader(h))
      .map(String))];
    const savedMapping = fullPromoColumnMapping();
    /* שלב 1: קיצורים שכבר מוכרים מהטבלה השמורה - מהיר, בלי לחכות לרשת. */
    const stillUnresolved = branchCols.filter(col=>!savedMapping[col]);
    if(!stillUnresolved.length){
      if(statusEl) statusEl.textContent = `כל ${branchCols.length} העמודות זוהו אוטומטית (מיפוי שמור).`;
      finalizePromoImport(savedMapping);
      return;
    }
    /* שלב 2: מה שלא נמצא בטבלה השמורה - ננסה התאמה ישירה מול רשימת הסניפים
       החיה (BRANCH_DIRECTORY), באותו מנגנון סלחני (normalizeBranchName +
       branchMatchScore) שכבר משמש בתחרויות ובהתאמת סניף במכר מבצעים. זה בדיוק
       פותר את המקרה שבו כותרת העמודה היא כבר שם הסניף המלא (למשל
       "01-ניצת תל-אביב") ולא קיצור - אין שום סיבה לשאול על זה ידנית. */
    if(statusEl) statusEl.textContent = 'מנסה להתאים עמודות אוטומטית מול רשימת הסניפים...';
    loadBranchDirectory().then(function(){
      const autoMatched = {};
      const trulyUnresolved = [];
      stillUnresolved.forEach(col=>{
        const entry = findBranchDirectoryEntry(col);
        if(entry) autoMatched[col] = entry.name;
        else trulyUnresolved.push(col);
      });
      const mapping = Object.assign({}, savedMapping, autoMatched);
      const matchedNowCount = Object.keys(autoMatched).length;
      const finishAuto = function(){
        if(!trulyUnresolved.length){
          const msg = matchedNowCount
            ? `${branchCols.length-stillUnresolved.length} עמודות זוהו ממיפוי שמור, ועוד ${matchedNowCount} זוהו אוטומטית מול רשימת הסניפים.`
            : `כל ${branchCols.length} העמודות זוהו אוטומטית.`;
          if(statusEl) statusEl.textContent = msg;
          finalizePromoImport(mapping);
        } else {
          if(statusEl) statusEl.textContent = `${branchCols.length-trulyUnresolved.length} מתוך ${branchCols.length} עמודות זוהו אוטומטית. נותרו ${trulyUnresolved.length} לפתרון ידני למטה.`;
          renderPromoUnresolvedForm(trulyUnresolved);
        }
      };
      /* התאמות אוטומטיות חדשות (autoMatched) נשמרות ל-Firestore מיד, כדי
         שגם הן "ייחסכו" בחודש הבא בלי לעבור שוב דרך findBranchDirectoryEntry. */
      if(matchedNowCount){
        const merged = Object.assign({}, appData.promoColumnMappingExtra||{}, autoMatched);
        db.collection('config').doc('promoColumnMapping').set({ mapping: merged }, {merge:true}).then(function(){
          appData.promoColumnMappingExtra = merged;
          finishAuto();
        }).catch(function(err){
          console.error('שמירת מיפוי אוטומטי נכשלה (לא קריטי, ממשיכים בכל זאת):', err);
          finishAuto();
        });
      } else {
        finishAuto();
      }
    });
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}
/* מציגה טופס קטן לפתרון קיצורי עמודות שאינם מוכרים - בחירת סניף מרשימה
   מלאה, פעם אחת לכל קיצור. הבחירה נשמרת ב-Firestore לתמיד. */
function renderPromoUnresolvedForm(unresolvedCols){
  const areaEl = document.getElementById('promo-unresolved-area');
  if(!areaEl) return;
  areaEl.innerHTML = '<div style="margin-top:10px;font-size:13px;color:var(--text-secondary);">טוען רשימת סניפים...</div>';
  loadBranchDirectory().then(function(){
    const sortedBranches = [...BRANCH_DIRECTORY].sort((a,b)=>a.name.localeCompare(b.name,'he'));
    areaEl.innerHTML = `
      <div style="border-top:1px solid var(--gridline);margin-top:14px;padding-top:14px;">
        <div style="font-weight:500;font-size:14px;margin-bottom:10px;">קיצורים לא מוכרים — בחרו סניף לכל אחד:</div>
        ${unresolvedCols.map((col,idx)=>`
          <div class="field" style="margin-bottom:10px;">
            <label>"${col}"</label>
            <select id="promo-resolve-${idx}">
              <option value="">— בחרו סניף —</option>
              ${sortedBranches.map(b=>`<option value="${b.name.replace(/"/g,'&quot;')}">${b.name}</option>`).join('')}
            </select>
          </div>
        `).join('')}
        <button class="btn-confirm" onclick='savePromoUnresolvedAndImport(${JSON.stringify(unresolvedCols)})'>שמירה והמשך ייבוא</button>
      </div>
    `;
  });
}
function savePromoUnresolvedAndImport(unresolvedCols){
  const statusEl = document.getElementById('promo-upload-status');
  const newEntries = {};
  for(let i=0;i<unresolvedCols.length;i++){
    const val = (document.getElementById('promo-resolve-'+i)||{}).value;
    if(!val){ toast('יש לבחור סניף לכל הקיצורים לפני שממשיכים'); return; }
    newEntries[unresolvedCols[i]] = val;
  }
  const merged = Object.assign({}, appData.promoColumnMappingExtra||{}, newEntries);
  if(statusEl) statusEl.textContent = 'שומר מיפוי חדש...';
  db.collection('config').doc('promoColumnMapping').set({ mapping: merged }, {merge:true}).then(function(){
    appData.promoColumnMappingExtra = merged;
    document.getElementById('promo-unresolved-area').innerHTML = '';
    finalizePromoImport(fullPromoColumnMapping());
  }).catch(function(err){
    if(statusEl) statusEl.textContent = 'שגיאה בשמירת המיפוי: ' + err.message;
  });
}
/* בונה את רשימת המוצרים מהשורות הגולמיות + המיפוי הסופי, ומחליף את כל
   התוכן הקיים ב-Firestore (מוחק ישן, כותב חדש) - אצווה, בדיוק כמו קודם. */
function finalizePromoImport(mapping){
  const statusEl = document.getElementById('promo-upload-status');
  const rows = pendingPromoImportRows;
  if(!rows){ if(statusEl) statusEl.textContent = 'שגיאה: אין קובץ טעון.'; return; }
  const products = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row[0]==null) continue;
    const code = row[0], title = row[1], total = row[2];
    const seen = {};
    for(let c=3;c<row.length;c++){
      const colHeader = rows[0][c];
      if(colHeader==null) continue;
      const branchName = mapping[String(colHeader)];
      const val = row[c];
      if(branchName && val){ seen[branchName] = (seen[branchName]||0) + Number(val); }
    }
    const branches = Object.keys(seen).map(name=>({name, sales: seen[name]}));
    products.push({code, title, total, branches});
  }
  if(statusEl) statusEl.textContent = `נמחקים ${(appData.promoProducts||[]).length} מוצרים ישנים...`;
  db.collection('promoProducts').get().then(function(snap){
    const delBatches = [];
    let batch = db.batch(); let n=0;
    snap.forEach(function(doc){
      batch.delete(doc.ref); n++;
      if(n===450){ delBatches.push(batch); batch = db.batch(); n=0; }
    });
    if(n>0) delBatches.push(batch);
    return Promise.all(delBatches.map(b=>b.commit()));
  }).then(function(){
    if(statusEl) statusEl.textContent = `כותב ${products.length} מוצרים חדשים...`;
    const writeBatches = [];
    let batch = db.batch(); let n=0;
    products.forEach(function(p){
      const ref = db.collection('promoProducts').doc();
      batch.set(ref, { code:p.code||null, title:p.title||'', total:p.total||0, branches:p.branches||[], department:'purchasing', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      n++;
      if(n===450){ writeBatches.push(batch); batch = db.batch(); n=0; }
    });
    if(n>0) writeBatches.push(batch);
    return Promise.all(writeBatches.map(b=>b.commit()));
  }).then(function(){
    if(statusEl) statusEl.textContent = `הועלו בהצלחה ${products.length} מוצרים.`;
    pendingPromoImportRows = null;
    toast('נתוני מכר מבצעים עודכנו בהצלחה');
  }).catch(function(err){
    if(statusEl) statusEl.textContent = 'שגיאה בהעלאה: ' + err.message;
  });
}
