<script>


/* מסך נחיתה למחלקה שיש לה מסכי תוכן (בשונה מ-viewDepartmentEmpty, שמיועד
   למחלקה שעדיין לא פרסמה כלום). מציג כרטיסי בחירה לכל מסך במחלקה. */
function viewDepartmentLanding(deptKey){
  const info = DEPARTMENTS[deptKey] || {label: deptKey};
  const screens = DEPARTMENT_SCREENS[deptKey] || [];
  return `
    <div class="page-head">
      <h1>${info.label}</h1>
      <p>בחרו מה לצפות</p>
    </div>
    <div class="dashboard-actions-grid">
      ${screens.map(s=>`<button class="dashboard-action-btn" onclick="goTo('${s.id}')"><span class="da-icon">${s.icon}</span><span class="da-label">${s.label}</span></button>`).join('')}
    </div>
  `;
}
/* ---------- דף הבית הגלובלי (רב-מחלקתי) ---------- */
/* מוצג לסניפים/מנהלי אזור ברמה העליונה, לפני שנכנסים למחלקה ספציפית. פיד
   מאוחד מכל המחלקות (כרגע רק שיווק מפרסמת, אז זה כמעט זהה למה שהיה קודם —
   ההבדל היחיד הוא תגית המחלקה על כל פריט וכפתורי הכניסה למחלקות בניווט). */
function viewGlobalHome(){
  const feed = [
    ...appData.instructions.map(i=>({type:'instruction', date:i.date, title:i.title, id:i.id, unread:!isItemRead('instructions', i.id), department:itemDepartment(i)})),
    ...appData.competitions.map(c=>({type:'competition', date:c.start, title:c.title, id:c.id, department:itemDepartment(c)})),
    ...appData.events.filter(isEventVisibleToViewer).map(e=>({type:'event', date:e.date, title:e.title, id:e.id, department:itemDepartment(e)}))
  ].sort((a,b)=> parseHebDate(b.date)-parseHebDate(a.date)).slice(0,8);
  const greetName = session.role==='area' ? session.areaLabel
    : session.role==='marketing' ? marketingDisplayFor(currentUserEmail).name
    : (session.branchInfo && session.branchInfo.manager ? session.branchInfo.manager : session.branchName);
  return `
    <div class="page-head">
      <h1>שלום, ${greetName} 👋</h1>
      ${session.branchInfo ? `<p style="margin:-4px 0 8px;font-size:12.5px;color:var(--muted);">${session.branchName}</p>` : ''}
      <p>${session.role==='marketing' ? 'כך נראה כרגע כל מה שמפורסם לסניפים, מכל המחלקות' : 'עדכונים שוטפים מכל המחלקות'}</p>
    </div>
    ${isRealAreaManager() ? renderAreaManagerConversationsCard() : ''}
    ${session.role==='branch' ? renderBranchConversationsCard() : ''}
    <h3 style="font-size:15px;margin:8px 0 12px;">הכלים שלי</h3>
    ${renderMyCalendarCard()}
    <h3 style="font-size:15px;margin:8px 0 12px;">חדש עבורכם</h3>
    <div class="card" style="overflow:visible;">
      ${feed.length ? feed.map(f=>{
        const screenId = f.type==='instruction'?'instructions':f.type==='event'?'events':'competitions';
        return `

function fmtMoney(n){
  return (n||0).toLocaleString(undefined, {maximumFractionDigits:2});
}
function parseHebDate(d){
  if(!d || typeof d !== 'string') return NaN;
  const [dd,mm,yy] = d.split('.').map(Number);
  if(!dd || !mm || !yy) return NaN;
  return new Date(yy,mm-1,dd).getTime();
}

/* ---------- Competitions ---------- */

/* ---- Generic, structure-driven Excel competition parser ----
   Detects repeated header rows (שם חנות/יעד/מכירות/אחוז מהיעד/מנהל אזור)
   to auto-split branches into a DYNAMIC number of groups (not hardcoded),
   and parses the "פרסים" section into tiered, ranked prize lists per group. */
const HEB_ORDINAL_RANK = {'ראשון':1,'שני':2,'שלישי':3,'רביעי':4,'חמישי':5,'שישי':6,'שביעי':7,'שמיני':8,'תשיעי':9,'עשירי':10};
const EXCLUDED_MANAGER = 'עופר דרורי'; /* מוצא באופן גורף מכל ייבוא/הצגה של אקסלי מכירות, לפי בקשת אלירן */
/* השוואה סלחנית לשם המנהל המוחרג — מתעלמת מרווחים כפולים/מובילים/סוגרים
   ומכל תו לא-רגיל, כדי לא לפספס אותו בגלל הבדל עדין בין קבצי אקסל שונים. */
function isExcludedManagerName(name){
  if(!name) return false;
  const normalized = name.toString().replace(/\s+/g,' ').trim();
  return normalized.indexOf(EXCLUDED_MANAGER) !== -1;
}
/* מעצב ערך תא בדיוק כמו שהוא מוצג באקסל המקורי (עבור טבלאות "AS IS") */
function formatSheetCellValue(raw, type){
  if(raw===undefined || raw===null || raw==='') return '';
  if(typeof raw === 'number'){
    if(type==='pct') return (raw*100).toFixed(2)+'%';
    if(type==='money') return raw.toLocaleString('he-IL', {maximumFractionDigits:0});
    if(type==='int') return raw.toLocaleString('he-IL');
    return raw.toString();
  }
  return raw.toString();
}
function normalizeBranchName(raw){
  let s = (raw||'').toString().trim();
  s = s.replace(/^\d+\s*[-–]?\s*/,'');
  s = s.replace(/^ניצת\s*[-–]?\s*/,'');
  s = s.replace(/[`'"׳״]/g,'');
  s = s.replace(/תקווה/g,'תקוה');
  s = s.replace(/(^|\s)ק\.(?=\S)/g,'$1קריית ');
  s = s.replace(/[-–]/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  const LOC_ABBR = {'תא':'תל אביב','פת':'פתח תקוה','קש':'קריית שמונה','ראשלץ':'ראשון לציון','בש':'באר שבע','ק':'קריית','רמהש':'רמת השרון'};
  s = s.split(' ').map(w=> LOC_ABBR[w] || w).join(' ');
  return s.replace(/\s+/g,' ').trim();
}
function wordSubsetMatch(a,b){
  const wa = a.split(' ').filter(Boolean), wb = b.split(' ').filter(Boolean);
  if(!wa.length || !wb.length) return false;
  const setA = new Set(wa), setB = new Set(wb);
  return wa.every(w=>setB.has(w)) || wb.every(w=>setA.has(w));
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp=[];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function seqIndex(big, small){
  if(!small.length || small.length>big.length) return -1;
  for(let i=0;i<=big.length-small.length;i++){
    let ok=true;
    for(let j=0;j<small.length;j++){ if(big[i+j]!==small[j]){ ok=false; break; } }
    if(ok) return i;
  }
  return -1;
}
function branchMatchScore(target, name){
  if(target === name) return 0;
  const tWords = target.split(' ').filter(Boolean);
  const nWords = name.split(' ').filter(Boolean);
  let idx = seqIndex(nWords, tWords);
  if(idx>=0) return 1 + (nWords.length-tWords.length)*0.4 + idx*0.15;
  idx = seqIndex(tWords, nWords);
  if(idx>=0) return 1 + (tWords.length-nWords.length)*0.4 + idx*0.15;
  if(wordSubsetMatch(target, name)) return 1.8;
  return 2.5 + levenshtein(target, name) * 0.35;
}
/* מוצאת את "הסניף שלי" בתוך רשימת הסניפים של מוצר מכר מבצעים — משתמשת
   באותו מנגנון התאמת שמות בדיוק כמו matchBranchInCompetition, כדי לא ליצור
   לוגיקת התאמה מקבילה. */
function matchMyBranchInPromoProduct(product, branchInfo){
  if(!product.branches || !product.branches.length || !branchInfo) return null;
  const target = normalizeBranchName(branchInfo.name);
  for(const b of product.branches){ if(normalizeBranchName(b.name) === target) return b; }
  let best=null, bestScore=Infinity;
  for(const b of product.branches){
    const score = branchMatchScore(target, normalizeBranchName(b.name));
    if(score < bestScore){ bestScore = score; best = b; }
  }
  return (best && bestScore < 3.2) ? best : null;
}
/* מוצאת את רשומת הסניף בספר הסניפים החי (BRANCH_DIRECTORY) לפי שם גולמי
   מתוך מוצר מכר מבצעים - אותו מנגנון התאמה בדיוק, כדי לדעת לאיזה אזור
   (b.area) הסניף שייך, בלי תלות בנתוני תחרות. */
const _branchDirEntryCache = {};
function findBranchDirectoryEntry(rawName){
  if(_branchDirEntryCache.hasOwnProperty(rawName)) return _branchDirEntryCache[rawName];
  const target = normalizeBranchName(rawName);
  let found = null;
  for(const b of BRANCH_DIRECTORY){ if(normalizeBranchName(b.name) === target){ found = b; break; } }
  if(!found){
    let best=null, bestScore=Infinity;
    for(const b of BRANCH_DIRECTORY){
      const score = branchMatchScore(target, normalizeBranchName(b.name));
      if(score < bestScore){ bestScore = score; best = b; }
    }
    found = (best && bestScore < 3.2) ? best : null;
  }
  _branchDirEntryCache[rawName] = found;
  return found;
}
/* מקבצת את הסניפים של מוצר מכר-מבצעים לפי אזור, ומחזירה חציון לכל אזור. */
let _promoAreaGroupCache = {};
function groupPromoProductByArea(product){
  if(_promoAreaGroupCache.hasOwnProperty(product.id)) return _promoAreaGroupCache[product.id];
  const areaMap = {};
  (product.branches||[]).forEach(b=>{
    const dirEntry = findBranchDirectoryEntry(b.name);
    const area = (dirEntry && dirEntry.area) || 'לא משויך';
    if(!areaMap[area]) areaMap[area] = {area, sum:0, count:0, branches:[]};
    areaMap[area].sum += (b.sales||0);
    areaMap[area].count++;
    areaMap[area].branches.push({name:b.name, sales:b.sales||0});
  });
  const result = Object.values(areaMap).map(a=>({area:a.area, med: median(a.branches.map(x=>x.sales)), count:a.count, branches:a.branches}));
  _promoAreaGroupCache[product.id] = result;
  return result;
}
/* פירוט כל סניפי האזור שלי במוצר נתון, ממוין מהגבוה לנמוך - זה מה שנותן
   למנהל האזור לראות בדיוק כמה כל סניף שלו מכר, לא רק חציון כללי. */
function myAreaBranchBreakdown(product){
  if(!isAreaViewer()) return [];
  const grouped = groupPromoProductByArea(product);
  const mine = grouped.find(a=>a.area===session.areaLabel);
  return mine ? [...mine.branches].sort((a,b)=>b.sales-a.sales) : [];
}
/* מחשבת את "הערך שלי" במוצר, בהתאם לתפקיד הצופה: סניף רואה את המכירה שלו,
   מנהל אזור רואה את חציון כל הסניפים באזור שלו. */
function computeMyPromoValue(product){
  if(session.role==='branch' && session.branchInfo){
    const b = matchMyBranchInPromoProduct(product, session.branchInfo);
    return b ? {sales:b.sales, label:'הסניף שלכם', unitLabel:'יחידות שנמכרו'} : null;
  }
  if(session.role==='area' && session.areaLabel){
    const grouped = groupPromoProductByArea(product);
    const mine = grouped.find(a=>a.area===session.areaLabel);
    return mine ? {sales: Math.round(mine.med*10)/10, label:`חציון האזור שלכם (${mine.count} סניפים)`, unitLabel:'יחידות (חציון)'} : null;
  }
  return null;
}

/* ============================================================
   מנוע ניתוח מכר מבצעים (רכש) — סיווג לשלוש קבוצות
   ------------------------------------------------------------
   בונה, לכל קוד מבצע, את "המימוש שלי" (סניף או סכום סניפי אזור) מול
   חציון קבוצת השוואה (כל שאר הסניפים, או רק ביו מרקט אם מוגבל), ומסווג
   ל"בדיקת חריגה" (אפס מקומי מול פעילות רשתית), "בירור פער" (מתחת
   לחציון) או "לשמר חוזקה" (מעל החציון). בנוי מעל promoProducts (מכר בפועל)
   + promoBooklet (מטא-דאטה מהחוברת: תבנית/מחיר/הערות/הגבלות/איחודים),
   כך שאם promoBooklet ריק (עוד לא הועלה החודש) המסך פשוט לא מציג ניתוח,
   בלי לשבור את שאר האתר. */
function median(arr){
  if(!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function promoMultiplier(template){
  if(!template) return 1;
  if(template.indexOf("2 יח") !== -1) return 2;
  if(template.indexOf('3 יחידות') !== -1) return 3;
  if(template.indexOf('5 יחידות') !== -1) return 5;
  if(template.indexOf('מוצר שני') !== -1) return 2;
  return 1;
}
/* בנייה חד-פעמית (פר-רינדור) של: (1) מוצרים ממוזגים לפי קוד מאוחד
   (mergedInto מסוכם לתוך קוד ההורה), (2) מפת branchName -> sales לכל קוד. */
let _promoAnalysisCache = null;
function buildPromoAnalysisBase(){
  if(_promoAnalysisCache) return _promoAnalysisCache;
  const booklet = appData.promoBooklet || {};
  const byCode = {}; /* code -> {title, salesByBranch:{branch:num}} */
  (appData.promoProducts||[]).forEach(p=>{
    const code = p.code!=null ? String(p.code) : null;
    if(!code) return;
    const meta = booklet[code];
    const targetCode = (meta && meta.mergedInto) ? meta.mergedInto : code;
    if(!byCode[targetCode]) byCode[targetCode] = {title:null, salesByBranch:{}};
    if(!meta || !meta.mergedInto) byCode[targetCode].title = p.title;
    (p.branches||[]).forEach(b=>{
      byCode[targetCode].salesByBranch[b.name] = (byCode[targetCode].salesByBranch[b.name]||0) + (b.sales||0);
    });
  });
  _promoAnalysisCache = {byCode};
  return _promoAnalysisCache;
}
const BIO_MARKET_MATCH = 'ביו מרקט';
function isBioMarketBranch(name){ return (name||'').indexOf(BIO_MARKET_MATCH) !== -1; }
/* קבוצת ההשוואה הרשתית לקוד נתון: כל הסניפים, חוץ מהמוצאים בפועל
   (excludeNames) - או רק סניפי ביו מרקט אם המבצע מוגבל אליהם. */
function promoComparisonPool(meta, excludeNames){
  const allBranchNames = BRANCH_DIRECTORY.map(b=>b.name);
  const pool = (meta && meta.restricted==='ביו מרקט') ? allBranchNames.filter(isBioMarketBranch) : allBranchNames;
  return pool.filter(n=>excludeNames.indexOf(n)===-1);
}
function isPromoRelevantForBranch(meta, branchName){
  if(meta && meta.restricted==='ביו מרקט') return isBioMarketBranch(branchName);
  return true;
}
/* מסווגת ערך אחד (סניף/אזור) מול מערך ערכי השוואה. group: 'anomaly'|'gap'|'strength'|'none' */
function classifyPromoValue(selfVal, comparisonVals){
  const med = median(comparisonVals);
  const positiveOthers = comparisonVals.filter(v=>v>0).length;
  const totalOthers = comparisonVals.length;
  const gapNum = med===null ? null : (selfVal-med);
  const gapPct = (med && med>0) ? ((selfVal/med-1)*100) : null;
  let group = 'none';
  if(selfVal===0 && totalOthers>0 && (positiveOthers/totalOthers)>=0.7 && positiveOthers>=10) group = 'anomaly';
  else if(med!==null && selfVal<med) group = 'gap';
  else if(med!==null && selfVal>med) group = 'strength';
  return {med, positiveOthers, totalOthers, gapNum, gapPct, group, selfVal};
}
/* דוח מלא לסניף בודד: שלוש קבוצות + ממצאים שסויגו החוצה. */
function buildPromoBranchReport(branchName){
  const {byCode} = buildPromoAnalysisBase();
  const booklet = appData.promoBooklet || {};
  const out = {anomaly:[], gap:[], strength:[], scopedOut:[]};
  Object.keys(byCode).forEach(code=>{
    const meta = booklet[code] || {};
    const entry = byCode[code];
    if(!isPromoRelevantForBranch(meta, branchName)){ out.scopedOut.push({code, title:entry.title, reason:`מבצע ייעודי ל${meta.restricted}, לא רלוונטי לסניף זה.`}); return; }
    const selfVal = entry.salesByBranch[branchName] || 0;
    const compVals = promoComparisonPool(meta, [branchName]).map(n=>entry.salesByBranch[n]||0);
    if(!compVals.length){ out.scopedOut.push({code, title:entry.title, reason:'אין סניפי השוואה זמינים.'}); return; }
    const cls = classifyPromoValue(selfVal, compVals);
    if(cls.group==='none') return;
    out[cls.group].push({code, title:entry.title, meta, cls});
  });
  return out;
}
/* דוח מלא לאזור (קבוצת סניפים): סכום הסניפים באזור מול "צפי" = חציון
   הרשת (למעט סניפי האזור) × מספר סניפים באזור. קירוב מוצהר, לא מדד רשמי.
   בכל שורה מצורפת גם רשימת הסניפים באזור עם 0 מימושים באותו קוד - חשוב
   למנהל האזור לראות בדיוק אילו סניפים ספציפיים לא מימשו, לא רק את הסכום. */
function buildPromoAreaReport(areaBranchNames){
  const {byCode} = buildPromoAnalysisBase();
  const booklet = appData.promoBooklet || {};
  const out = {anomaly:[], gap:[], strength:[], scopedOut:[]};
  Object.keys(byCode).forEach(code=>{
    const meta = booklet[code] || {};
    const entry = byCode[code];
    const relevant = areaBranchNames.filter(n=>isPromoRelevantForBranch(meta, n));
    if(!relevant.length) return;
    const totalSelf = relevant.reduce((s,n)=>s+(entry.salesByBranch[n]||0),0);
    const zeroBranches = relevant.filter(n=>(entry.salesByBranch[n]||0)===0);
    const compVals = promoComparisonPool(meta, areaBranchNames).map(n=>entry.salesByBranch[n]||0);
    const med = median(compVals);
    if(med===null) return;
    const expected = med * relevant.length;
    const gapPct = expected>0 ? ((totalSelf/expected-1)*100) : null;
    let group = 'none';
    if(totalSelf===0 && expected>0) group = 'anomaly';
    else if(totalSelf<expected) group = 'gap';
    else if(totalSelf>expected) group = 'strength';
    if(group==='none') return;
    out[group].push({code, title:entry.title, meta, cls:{selfVal:totalSelf, med:expected, gapPct, branchCount:relevant.length, zeroBranches}});
  });
  return out;
}
function promoInsightText(row, isArea){
  const {meta, cls} = row;
  const parts = [];
  if(row.__group==='anomaly' || (!isArea && cls.group==='anomaly')){
    if(isArea){
      parts.push(`אפס מימושים באזור. הצפי (חציון הרשת × מספר סניפים) היה ${cls.med.toFixed(1)}.`);
    } else {
      parts.push(`0 מימושים בסניף, מול ${cls.positiveOthers} מתוך ${cls.totalOthers} סניפים אחרים פעילים. החציון הוא ${cls.med}.`);
    }
  } else if(row.__group==='gap' || (!isArea && cls.group==='gap')){
    if(meta.note && meta.note.indexOf('בחוץ מדף')!==-1) parts.push('כדאי לבדוק שילוט/מיקום מול ההנחיה: ' + meta.note.replace('מימושים.','').trim());
    if(meta.template && (meta.template.indexOf('שני')!==-1 || meta.template.indexOf("2 יח")!==-1)) parts.push('מבצע זוגות/שני יחידות — ייתכן שלקוחות לא משלימים את המימוש.');
    if(!parts.length) parts.push('פער מתחת לחציון קבוצת ההשוואה; מומלץ בדיקת זמינות ומיקום.');
  } else {
    parts.push(cls.med===0 ? 'פעילות חיובית מול בסיס השוואה נמוך — לא בהכרח הצטיינות.' : 'מעל החציון — לשמר זמינות.');
  }
  if(isArea && cls.zeroBranches && cls.zeroBranches.length){
    parts.push(`סניפים באזור עם 0 מימושים: ${cls.zeroBranches.join(', ')}.`);
  }
  if(meta.restricted) parts.push(`⚠ מבצע ייעודי ל${meta.restricted} בלבד.`);
  if(meta.needsParticipantList) parts.push('⚠ בחוברת סומן כ"פתוח לחלק מהסניפים בלבד" - נתוני המכר מראים בפועל מי מוכר ומי לא, כך שסניף עם מכירות בפועל נחשב משתתף מאומת.');
  const mult = promoMultiplier(meta.template);
  if(mult>1 && !isArea) parts.push(`כל מימוש = ${mult} פריטים (${cls.selfVal} מימושים ≈ ${cls.selfVal*mult} פריטים).`);
  return parts.join(' ');
}
function promoGroupLabel(group){
  return group==='anomaly' ? 'בדיקת חריגה' : (group==='gap' ? 'בירור פער' : 'לשמר חוזקה');
}
function promoGroupColor(group){
  return group==='anomaly' ? 'var(--critical)' : (group==='gap' ? 'var(--warning)' : 'var(--good)');
}
function promoAnalysisRowHtml(row, group, isArea){
  row.__group = group;
  const priceTxt = row.meta.price ? '₪'+Number(row.meta.price).toFixed(2) : '';
  const codeTxt = row.code;
  const areaPrefix = row.cls.areaLabel ? `<span style="color:var(--blue,#185FA5);font-weight:600;">אזור ${row.cls.areaLabel}</span> · ` : '';
  return `
    <div class="admin-row" style="align-items:flex-start;flex-direction:column;gap:6px;">
      <div class="admin-row-main">
        <div class="t">${areaPrefix}${row.title||''} <span style="font-family:monospace;font-size:11.5px;color:var(--muted);">#${codeTxt}</span></div>
        <div class="m">${row.meta.template||''} ${priceTxt}</div>
      </div>
      <div style="font-size:12.5px;color:var(--text-secondary);">${promoInsightText(row, isArea)}</div>
    </div>
  `;
}
function promoAnalysisSectionHtml(title, group, rows, isArea, emptyMsg){
  const sortFn = (a,b)=>{
    if(group==='anomaly') return (b.cls.positiveOthers||0)-(a.cls.positiveOthers||0);
    if(group==='strength') return (b.cls.gapPct||0)-(a.cls.gapPct||0);
    return Math.abs(b.cls.gapNum||(b.cls.selfVal-b.cls.med)||0) - Math.abs(a.cls.gapNum||(a.cls.selfVal-a.cls.med)||0);
  };
  const sorted = [...rows].sort(sortFn);
  const visible = sorted.slice(0,5);
  const rest = sorted.slice(5);
  const extraId = 'promo-extra-' + group;
  return `
    <div style="margin-bottom:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${promoGroupColor(group)};display:inline-block;"></span>
        <h3 style="margin:0;font-size:14.5px;">${title} <span style="font-weight:400;color:var(--text-secondary);font-size:12.5px;">(${rows.length} ממצאים)</span></h3>
      </div>
      <div class="card">
        ${visible.length ? visible.map(r=>promoAnalysisRowHtml(r,group,isArea)).join('') : `<div class="empty-state">${emptyMsg}</div>`}
        ${rest.length ? `
          <div id="${extraId}" style="display:none;">${rest.map(r=>promoAnalysisRowHtml(r,group,isArea)).join('')}</div>
          <button id="${extraId}-btn" class="icon-btn" style="width:100%;margin-top:8px;font-size:12.5px;" onclick="togglePromoMore('${extraId}')">הראה לי עוד (${rest.length} נוספים)</button>
        ` : ''}
      </div>
    </div>
  `;
}
function togglePromoMore(id){
  const el = document.getElementById(id);
  if(el) el.style.display = 'block';
  const btn = document.getElementById(id+'-btn');
  if(btn) btn.style.display = 'none';
}
/* גרסה לתצוגה הארצית: הממצאים מגיעים מכל 6 האזורים מעורבבים יחד, אז מיון
   שטוח + slice(0,5) גלובלי עלול "לבלוע" אזור שקט לגמרי אם אזור אחר רועש.
   כאן ממיינים בתוך כל אזור בנפרד, לוקחים עד 5 לכל אזור, ואז מציגים אזור
   אחר אזור (בסדר האזורים שבטבלת ה-KPI) עם כותרת-משנה לכל אזור. */
function promoNationalSectionHtml(title, group, rows, emptyMsg, capPerArea){
  const cap = capPerArea || 5;
  const sortFn = (a,b)=>{
    if(group==='anomaly') return (b.cls.positiveOthers||0)-(a.cls.positiveOthers||0);
    if(group==='strength') return (b.cls.gapPct||0)-(a.cls.gapPct||0);
    return Math.abs(b.cls.gapNum||(b.cls.selfVal-b.cls.med)||0) - Math.abs(a.cls.gapNum||(a.cls.selfVal-a.cls.med)||0);
  };
  const areaLabels = Object.values(AREA_MANAGER_INFO).filter(v=>v.areaName).map(v=>v.areaName);
  const byArea = areaLabels.map(area=>{
    const sortedArea = rows.filter(r=>r.cls.areaLabel===area).sort(sortFn);
    return {area, visible: sortedArea.slice(0,cap), rest: sortedArea.slice(cap)};
  }).filter(x=>x.visible.length);
  return `
    <div style="margin-bottom:18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${promoGroupColor(group)};display:inline-block;"></span>
        <h3 style="margin:0;font-size:14.5px;">${title} <span style="font-weight:400;color:var(--text-secondary);font-size:12.5px;">(${rows.length} ממצאים בס"ה)</span></h3>
      </div>
      <div class="card">
        ${byArea.length ? byArea.map(({area,visible,rest})=>{
          const extraId = 'promo-extra-national-' + group + '-' + area;
          return `
          <div style="margin-bottom:10px;">
            <div style="font-size:12.5px;font-weight:600;color:var(--blue,#185FA5);padding:6px 4px 2px;">אזור ${area}</div>
            ${visible.map(r=>promoAnalysisRowHtml(r,group,true)).join('')}
            ${rest.length ? `
              <div id="${extraId}" style="display:none;">${rest.map(r=>promoAnalysisRowHtml(r,group,true)).join('')}</div>
              <button id="${extraId}-btn" class="icon-btn" style="width:100%;margin-top:4px;font-size:12px;" onclick="togglePromoMore('${extraId}')">הראה לי עוד (${rest.length} נוספים באזור ${area})</button>
            ` : ''}
          </div>
        `;}).join('') : `<div class="empty-state">${emptyMsg}</div>`}
      </div>
    </div>
  `;
}
/* דוח מאקרו לתצוגה ארצית (ארבל/עופר) - לא ברמת סניף, אלא ברמת אזור מול
   אזור. לכל קוד מבצע, כל אזור מושווה מול חציון "הממוצע לסניף" של שאר
   האזורים (מנורמל למספר הסניפים באזור, כדי שאזור גדול לא ייראה חזק
   באופן מלאכותי רק כי יש בו יותר סניפים). */
function buildPromoNationalReport(){
  const {byCode} = buildPromoAnalysisBase();
  const booklet = appData.promoBooklet || {};
  const areaLabels = Object.values(AREA_MANAGER_INFO).filter(v=>v.areaName).map(v=>v.areaName);
  const areaBranchMap = {};
  areaLabels.forEach(a=>{ areaBranchMap[a] = BRANCH_DIRECTORY.filter(b=>b.area===a).map(b=>b.name); });
  const out = {anomaly:[], gap:[], strength:[]};
  Object.keys(byCode).forEach(code=>{
    const meta = booklet[code] || {};
    const entry = byCode[code];
    const areaStats = areaLabels.map(a=>{
      const branches = (areaBranchMap[a]||[]).filter(n=>isPromoRelevantForBranch(meta, n));
      if(!branches.length) return null;
      const total = branches.reduce((s,n)=>s+(entry.salesByBranch[n]||0),0);
      const zeroBranches = branches.filter(n=>(entry.salesByBranch[n]||0)===0);
      return {area:a, total, perBranch: total/branches.length, count:branches.length, zeroBranches};
    }).filter(Boolean);
    if(areaStats.length<2) return; /* אין מה להשוות בין פחות משני אזורים */
    areaStats.forEach(as=>{
      const others = areaStats.filter(x=>x.area!==as.area).map(x=>x.perBranch);
      const med = median(others);
      if(med===null) return;
      const expected = med * as.count;
      const gapPct = expected>0 ? ((as.total/expected-1)*100) : null;
      let group = 'none';
      if(as.total===0 && expected>0) group = 'anomaly';
      else if(as.total<expected) group = 'gap';
      else if(as.total>expected) group = 'strength';
      if(group==='none') return;
      out[group].push({code, title:entry.title, meta, cls:{selfVal:as.total, med:expected, gapPct, branchCount:as.count, zeroBranches:as.zeroBranches, areaLabel:as.area}});
    });
  });
  return out;
}
/* טבלת KPI תמציתית לכל אזור: סה"כ מימושים ברשת (כל הקודים), ומספר קודים
   בכל אחת משלוש הקבוצות - זו התמונה ה"ארצית לפי מנהלי אזור" עצמה. */
function promoNationalSummaryTableHtml(report){
  const areaLabels = Object.values(AREA_MANAGER_INFO).filter(v=>v.areaName).map(v=>v.areaName);
  const rows = areaLabels.map(a=>{
    const areaBranches = BRANCH_DIRECTORY.filter(b=>b.area===a).map(b=>b.name);
    const {byCode} = buildPromoAnalysisBase();
    let total = 0;
    Object.values(byCode).forEach(entry=>{ areaBranches.forEach(n=>{ total += (entry.salesByBranch[n]||0); }); });
    const anomalyCount = report.anomaly.filter(r=>r.cls.areaLabel===a).length;
    const gapCount = report.gap.filter(r=>r.cls.areaLabel===a).length;
    const strengthCount = report.strength.filter(r=>r.cls.areaLabel===a).length;
    return {area:a, branchCount:areaBranches.length, total, anomalyCount, gapCount, strengthCount};
  }).sort((x,y)=>y.total-x.total);
  return `
    <div class="card" style="margin-bottom:18px;overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;">
        <thead><tr style="text-align:right;color:var(--text-secondary);">
          <th style="padding:6px 8px;">מנהל אזור</th><th style="padding:6px 8px;">סניפים</th>
          <th style="padding:6px 8px;">סה"כ מימושים (כל הקודים)</th>
          <th style="padding:6px 8px;color:var(--critical,#d03b3b);">בדיקת חריגה</th>
          <th style="padding:6px 8px;color:var(--warning,#c9962f);">בירור פער</th>
          <th style="padding:6px 8px;color:var(--good,#0ca30c);">לשמר חוזקה</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr style="border-top:1px solid var(--gridline);">
              <td style="padding:6px 8px;font-weight:500;">${r.area}</td>
              <td style="padding:6px 8px;">${r.branchCount}</td>
              <td style="padding:6px 8px;">${r.total}</td>
              <td style="padding:6px 8px;">${r.anomalyCount||'—'}</td>
              <td style="padding:6px 8px;">${r.gapCount||'—'}</td>
              <td style="padding:6px 8px;">${r.strengthCount||'—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
/* המסך הראשי לניתוח מכר מבצעים (סניף/אזור) - מוצג מעל עיון-לפי-מוצר. */
function viewPromoAnalysis(){
  const bookletCount = Object.keys(appData.promoBooklet||{}).length;
  if(!bookletCount){
    return `<div class="card"><div class="empty-state">עדיין לא הועלתה חוברת המבצעים החודשית — הניתוח יופיע כאן ברגע שרכש יעלה אותה ב"ניהול תוכן".</div></div>`;
  }
  if(hasPromoNationalAccess()){
    const report = buildPromoNationalReport();
    return `
      <div class="card" style="margin-bottom:16px;">
        <div style="font-weight:500;font-size:15px;margin-bottom:4px;">ניתוח מכר מבצעים — תצוגה ארצית לפי מנהלי אזור</div>
        <div style="font-size:12.5px;color:var(--text-secondary);">כל אזור מושווה מול שאר האזורים (ממוצע לסניף, מנורמל למספר הסניפים באזור). אין כאן פירוט ברמת סניף בודד.</div>

function cellFillHex(sheet, ri, ci){
  if(!sheet || typeof XLSX==='undefined') return null;
  try{
    const addr = XLSX.utils.encode_cell({r:ri, c:ci});
    const cell = sheet[addr];
    if(cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb && cell.s.patternType==='solid'){
      return '#' + cell.s.fgColor.rgb.slice(-6).toUpperCase();
    }
  }catch(e){}
  return null;
}
function contrastTextColor(hex){
  const h = (hex||'').replace('#','');
  if(h.length<6) return '#1a1a1a';
  const r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  const lin = c => c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  const L = 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L > 0.45 ? '#1a1a1a' : '#ffffff';
}
function managerChip(comp, name){
  if(!name) return '';
  const hex = comp && comp.managerColors ? comp.managerColors[name] : null;
  if(!hex) return `<span class="mgr-chip mgr-chip-plain">${name}</span>`;
  const textColor = contrastTextColor(hex);
  return `<span class="mgr-chip" style="background:${hex};color:${textColor};border-color:${textColor==='#ffffff'?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.15)'};">${name}</span>`;
}
/* קורא את טבלת האקסל הגולמית (ערכים + צבעי רקע כפי שהם בקובץ) כדי להציג אותה
   בדיוק כמו שמחלקת השיווק רגילה לשלוח במייל היומי — בלי לפרש/לעצב מחדש.
   טווח העמודות: מעמודה A (רצועת צבע הקבוצה) ועד עמודת מנהל אזור, לפי כל הכותרות שנמצאו. */
function extractRawSalesTable(rows, sheet, headers){
  if(!headers || !headers.length) return null;
  const h0 = headers[0];
  const colTypes = {};
  colTypes[h0.targetCol] = 'int';
  colTypes[h0.salesCol] = 'money';
  colTypes[h0.pctCol] = 'pct';
  const colStart = 0;
  const colEnd = Math.max(...headers.map(h=>h.managerCol));
  const rowStart = h0.rowIndex;
  let rowEnd = rows.length - 1;
  while(rowEnd > rowStart){
    const row = rows[rowEnd];
    const hasVal = row && row.slice(colStart, colEnd+1).some(v=>v!==null && v!==undefined && v!=='');
    if(hasVal) break;
    rowEnd--;
  }
  const tableRows = [];
  for(let ri=rowStart; ri<=rowEnd; ri++){
    const row = rows[ri] || [];
    const mgrCellVal = (row[h0.managerCol]||'').toString().trim();
    const cells = [];
    for(let ci=colStart; ci<=colEnd; ci++){
      if(ci===h0.managerCol && isExcludedManagerName(mgrCellVal)){
        cells.push({text:'', bg:null}); /* מנהל האזור הוסר — הסניף עצמו נשאר, ללא שיוך */
        continue;
      }
      const raw = row[ci];
      const text = formatSheetCellValue(raw, colTypes[ci]);
      cells.push({text, bg: cellFillHex(sheet, ri, ci)});
    }
    tableRows.push({cells});
  }
  return tableRows;
}
function parseCompetitionSheet(rows, sheet){
  const HEADER_NAME = 'שם חנות';
  const groupLabelRe = /^קבוצה\s*(\d+)/;
  const rankRe = /^מקום\s+(\S+)\s*[:：]?\s*(.*)$/;
  const headers = [];
  rows.forEach((row,ri)=>{
    if(!row) return;
    for(let ci=0; ci<row.length; ci++){
      if((row[ci]||'').toString().trim() === HEADER_NAME){
        headers.push({rowIndex:ri, nameCol:ci, targetCol:ci+1, salesCol:ci+2, pctCol:ci+3, managerCol:ci+4});
      }
    }
  });
  console.log('[parseCompetitionSheet] headers found:', headers.length, headers);
  if(!headers.length){
    console.warn('[parseCompetitionSheet] לא נמצאה אף כותרת "שם חנות" בקובץ — בודקים דגימת תאים מהשורות הראשונות:',
      rows.slice(0,5).map(r=>r ? r.slice(0,6) : r));
    return null;
  }

  const prizeSectionEnd = headers[0].rowIndex;
  const prizesByNum = {};
  const groupColorsByNum = {};
  for(let ri=0; ri<prizeSectionEnd; ri++){
    const row = rows[ri]; if(!row) continue;
    for(let ci=0; ci<row.length; ci++){
      const v = (row[ci]||'').toString().trim();
      const m = v.match(groupLabelRe);
      if(!m) continue;
      const num = parseInt(m[1],10);
      const colorHex = cellFillHex(sheet, ri, ci);
      if(colorHex) groupColorsByNum[num] = colorHex;
      const list = [];
      let rr = ri+1;
      while(rr < prizeSectionEnd){
        const nextRow = rows[rr];
        const cellVal = nextRow ? (nextRow[ci]||'').toString().trim() : '';
        if(!cellVal || groupLabelRe.test(cellVal)) break;
        const rm = cellVal.match(rankRe);
        if(rm){
          list.push({rank: HEB_ORDINAL_RANK[rm[1]] || (list.length+1), label:'מקום '+rm[1], text: rm[2].trim()});
        } else {
          list.push({rank:list.length+1, label:'', text:cellVal});
        }
        rr++;
      }
      prizesByNum[num] = list;
    }
  }


  const groups = [];
  const managerColors = {};
  headers.forEach((h,hi)=>{
    const endRow = hi+1 < headers.length ? headers[hi+1].rowIndex : rows.length;
    const branches = [];
    let groupNum = null;
    let target = null;
    for(let ri=h.rowIndex+1; ri<endRow; ri++){
      const row = rows[ri]; if(!row) continue;
      for(let ci=0; ci<h.nameCol; ci++){
        const v = (row[ci]||'').toString().trim();
        const m = v.match(groupLabelRe);
        if(m) groupNum = parseInt(m[1],10);
      }
      const rawName = (row[h.nameCol]||'').toString().trim();
      if(!rawName || /סה[״"]?כ/.test(rawName)) continue;
      const t = row[h.targetCol], s = row[h.salesCol], mgr = row[h.managerCol];
      let mgrName = (mgr||'').toString().trim();
      const isExcludedMgr = isExcludedManagerName(mgrName);
      if(isExcludedMgr){
        console.log('[parseCompetitionSheet] נמצא מנהל מוחרג בשורה', ri, '— מקורי:', JSON.stringify(mgrName), '← מנוקה');
        mgrName = ''; /* הסניף עצמו נשאר, ללא שיוך למנהל אזור */
      }
      if(target===null && typeof t === 'number') target = t;
      const rowCells = {
        name: {text: rawName, bg: cellFillHex(sheet, ri, h.nameCol)},
        target: {text: formatSheetCellValue(t, 'int'), bg: cellFillHex(sheet, ri, h.targetCol)},
        sales: {text: formatSheetCellValue(s, 'money'), bg: cellFillHex(sheet, ri, h.salesCol)},
        pct: {text: formatSheetCellValue(row[h.pctCol], 'pct'), bg: cellFillHex(sheet, ri, h.pctCol)},
        manager: isExcludedMgr ? {text:'', bg:null} : {text: mgrName, bg: cellFillHex(sheet, ri, h.managerCol)}
      };
      branches.push({
        rawName,
        name: normalizeBranchName(rawName),
        target: (typeof t === 'number') ? t : (target||0),
        sales: (typeof s === 'number') ? s : 0,
        areaManager: mgrName,
        rowCells
      });
      if(mgrName && !managerColors[mgrName]){
        const hex = cellFillHex(sheet, ri, h.managerCol);
        if(hex) managerColors[mgrName] = hex;
      }
    }
    if(!branches.length) return;
    if(groupNum===null) groupNum = hi+1;
    groups.push({groupNum, name:'קבוצה '+groupNum, target: target||0, colorHex: groupColorsByNum[groupNum]||null, prizes: prizesByNum[groupNum]||[], branches});
  });
  groups.sort((a,b)=>a.groupNum-b.groupNum);
  if(!groups.length){
    console.warn('[parseCompetitionSheet] נמצאו כותרות אך אף קבוצה/סניף לא חולץ מהן.');
    return null;
  }
  groups.managerColors = managerColors;
  groups.rawTable = extractRawSalesTable(rows, sheet, headers);
  const h0 = headers[0];
  groups.headerRowCells = [h0.nameCol, h0.targetCol, h0.salesCol, h0.pctCol, h0.managerCol].map(ci => ({
    text: (rows[h0.rowIndex][ci]||'').toString().trim(),
    bg: cellFillHex(sheet, h0.rowIndex, ci)
  }));
  console.log('[parseCompetitionSheet] הצלחה — קבוצות:', groups.length, 'שורות rawTable:', groups.rawTable ? groups.rawTable.length : null);
  const allManagerNames = new Set();
  let totalBranches = 0, has47 = false;
  groups.forEach(g=>g.branches.forEach(b=>{
    totalBranches++;
    allManagerNames.add(JSON.stringify(b.areaManager));
    if(b.rawName && b.rawName.indexOf('47')===0) has47 = true;
  }));
  console.log('[parseCompetitionSheet] סה"כ סניפים:', totalBranches, '| שמות מנהלי אזור שנמצאו:', [...allManagerNames], '| סניף 47 נמצא:', has47);
  return groups;
}
function matchBranchInCompetition(comp, directoryEntry){
  if(!comp.groups || !comp.groups.length || !directoryEntry) return null;
  const target = normalizeBranchName(directoryEntry.name);
  // Exact normalized-name identity always wins outright — name is the authoritative
  // key, so an exact match short-circuits before the area-code signal (a secondary,
  // sometimes-stale disambiguator) can override it.
  for(const g of comp.groups){
    for(const b of g.branches){ if(b.name === target) return {group:g, branch:b}; }
  }
  let best=null, bestScore=Infinity;
  for(const g of comp.groups){
    for(const b of g.branches){
      let score = branchMatchScore(target, b.name);
      if(directoryEntry.area && b.areaManager){
        score += (b.areaManager.indexOf(directoryEntry.area)===0) ? -0.5 : 2.0;
      }
      if(score < bestScore){ bestScore = score; best = {group:g, branch:b}; }
    }
  }
  return (best && bestScore < 3.2) ? best : null;
}

function detectDateRangeFromRows(rows){
  // Best-effort: looks for exactly two DD.MM.YYYY-style dates in the top of the sheet
  // (e.g. a "תוקף המבצע" cell or a header like "23.08.2026 - 02.10.2026"). If it finds
  // anything other than exactly two, it stays silent rather than risk guessing wrong —
  // the marketing user can always type the dates in manually.
  const dateRe = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g;
  const found = [];
  const limit = Math.min(rows.length, 15);
  for(let ri=0; ri<limit; ri++){
    const row = rows[ri]; if(!row) continue;
    for(let ci=0; ci<row.length; ci++){
      const v = (row[ci]||'').toString();
      let m;
      dateRe.lastIndex = 0;
      while((m = dateRe.exec(v))){
        const str = `${m[1].padStart(2,'0')}.${m[2].padStart(2,'0')}.${m[3]}`;
        if(!found.includes(str)) found.push(str);
      }
    }
  }
  if(found.length !== 2) return null;
  const [a,b] = found;
  return parseHebDate(a) <= parseHebDate(b) ? {start:a, end:b} : {start:b, end:a};
}

        evt.target.value = '';

      }
      pendingImportGroups = groups;
      pendingImportManagerColors = groups.managerColors || {};
      pendingImportRawTable = groups.rawTable || null;

      }
    }catch(err){
      console.error(err);
      toast('שגיאה בקריאת קובץ האקסל.');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';

function handleLogoFileChange(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(!file.type || file.type.indexOf('image/')!==0){ toast('נא לבחור קובץ תמונה (PNG / JPG / SVG)'); evt.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Downscale on a canvas so a large phone photo doesn't bloat the in-memory app state.
      const maxW = 480;
      const scale = Math.min(1, maxW/(img.width||maxW));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round((img.width||maxW)*scale));
      canvas.height = Math.max(1, Math.round((img.height||maxW)*scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingLogoDataUrl = canvas.toDataURL('image/png');
      renderLogoPreview();
    };
    img.onerror = function(){ toast('לא ניתן היה לקרוא את קובץ התמונה'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  evt.target.value = '';
}

/* ---- Daily sales report import (updates an existing competition's sales figures) ----
   Flexible parser: finds a header row containing a branch-name column (שם חנות/סניף)
   and a sales column (מכירות/סכום/סה"כ) on the same row, then reads cumulative sales
   per branch below it. Matching prefers the branch's store code (most reliable), then
   exact normalized name, then fuzzy fallback — reusing the same matching machinery
   already validated for competition-group imports. */
function parseDailyReportSheet(rows){
  const nameRe = /^(שם חנות|שם סניף|סניף)$/;
  const salesRe = /(מכירות|סכום|סה[״"]?כ)/;
  let headerRow=-1, nameCol=-1, salesCol=-1;
  for(let ri=0; ri<rows.length && headerRow<0; ri++){
    const row = rows[ri]; if(!row) continue;
    for(let ci=0; ci<row.length; ci++){
      const v = (row[ci]||'').toString().trim();
      if(!nameRe.test(v)) continue;
      for(let cj=0; cj<row.length; cj++){
        if(cj===ci) continue;
        const v2 = (row[cj]||'').toString().trim();
        if(salesRe.test(v2)){ headerRow=ri; nameCol=ci; salesCol=cj; break; }
      }
      if(headerRow>=0) break;
    }
  }
  if(headerRow<0) return null;
  const items = [];
  for(let ri=headerRow+1; ri<rows.length; ri++){
    const row = rows[ri]; if(!row) continue;
    const rawName = (row[nameCol]||'').toString().trim();
    if(!rawName || /סה[״"]?כ/.test(rawName)) continue;
    const salesVal = row[salesCol];
    if(typeof salesVal !== 'number') continue;
    const codeMatch = rawName.match(/^0*(\d+)/);
    items.push({ rawName, storeCode: codeMatch ? codeMatch[1] : null, name: normalizeBranchName(rawName), sales: salesVal });
  }
  return items.length ? items : null;
}
function matchDailyReportItem(comp, item){
  if(item.storeCode){
    for(const g of comp.groups){
      for(const b of g.branches){
        const bCode = b.rawName.match(/^0*(\d+)/);
        if(bCode && bCode[1]===item.storeCode) return {group:g, branch:b};
      }
    }
  }
  for(const g of comp.groups){
    for(const b of g.branches){ if(b.name===item.name) return {group:g, branch:b}; }
  }
  let best=null, bestScore=Infinity;
  for(const g of comp.groups){
    for(const b of g.branches){
      const score = branchMatchScore(item.name, b.name);
      if(score < bestScore){ bestScore=score; best={group:g, branch:b}; }
    }
  }
  return (best && bestScore < 2.0) ? best : null;
}
let dailyReportTargetCompId = null;
function triggerDailyReportImport(compId){
  dailyReportTargetCompId = compId;
  document.getElementById('daily-report-input').click();
}
function handleDailyReportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const compId = dailyReportTargetCompId;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellStyles:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      const comp = appData.competitions.find(c=>c.id==compId);
      if(!comp){ toast('התחרות לא נמצאה.'); return; }

      /* אם הדוח היומי הוא בפועל אותו מבנה מלא (עם קבוצות/מנהלי אזור/צבעים) —
         מחליפים לגמרי את הקבוצות, צבעי המנהלים והטבלה הגולמית מהקובץ הטרי,
         ולא רק את מספרי המכירות. כך כל תיקון מבני (הסרת/שינוי מנהל אזור,
         סניף שחוזר וכו') נכנס לתוקף גם דרך העדכון היומי, לא רק דרך "עריכה מלאה". */
      const fullParse = parseCompetitionSheet(rows, sheet);
      let updated = 0, totalItems = 0, unmatched = [];

      if(fullParse){
        comp.groups = fullParse;
        comp.managerColors = fullParse.managerColors || {};
        comp.rawTable = fullParse.rawTable || null;
        comp.headerRowCells = fullParse.headerRowCells || null;
        updated = fullParse.reduce((s,g)=>s+g.branches.length,0);
        totalItems = updated;
        console.log('[עדכון יומי] זוהה מבנה מלא — הקבוצות, צבעי המנהלים והטבלה הגולמית רועננו במלואם.');
      } else {
        const items = parseDailyReportSheet(rows);
        if(!items){
          toast('לא הצלחתי לזהות בקובץ עמודות של שם סניף וסכום מכירות.');
          return;
        }
        totalItems = items.length;
        items.forEach(item=>{
          const m = matchDailyReportItem(comp, item);
          if(m){ m.branch.sales = item.sales; updated++; } else unmatched.push(item.rawName);
        });
      }

      comp.salesUpdatedAt = todayHeb() + ' ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
      if(firebaseReady){
        db.collection('competitions').doc(comp.id).update({
          groups: comp.groups, managerColors: comp.managerColors || {}, rawTable: comp.rawTable || null,
          headerRowCells: comp.headerRowCells || null, salesUpdatedAt: comp.salesUpdatedAt
        })
          .then(()=>toast(`עודכנו ${updated} מתוך ${totalItems} סניפים בדוח.` + (unmatched.length ? ` (${unmatched.length} לא זוהו — ראו קונסול)` : '')))
          .catch(err=>toast('שגיאה בשמירת הדוח ל-Firestore: '+err.message));
      } else {
        renderContent();
        toast(`עודכנו ${updated} מתוך ${totalItems} סניפים בדוח.` + (unmatched.length ? ` (${unmatched.length} לא זוהו — ראו קונסול)` : ''));
      }
      if(unmatched.length) console.warn('שורות דוח יומי שלא זוהו:', unmatched);
    }catch(err){
      console.error(err);
      toast('שגיאה בקריאת קובץ הדוח.');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}

/* מסמן קטע שלם (תחרויות/חומרים/אירועים) כ"נקרא" עבור הצופה הנוכחי בלבד —
   לא רץ עבור מחלקת השיווק. כל פריט "לא נקרא" מקבל רשומת קריאה אישית
   (ראו markItemRead/isItemRead), כך שזה משפיע רק על מי שבאמת צפה, לא על כל

function formatCountdownParts(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const days = Math.floor(totalSec/86400);
  const hours = Math.floor((totalSec%86400)/3600);
  const mins = Math.floor((totalSec%3600)/60);
  const secs = totalSec%60;
  return {days,hours,mins,secs};
}
function countdownSegsHtml(p){
  // Visual order right-to-left (page is RTL): seconds, minutes, hours, days — days end up on the left.
  return `
        <span class="cd-seg"><b>${String(p.secs).padStart(2,'0')}</b><i>שנ'</i></span><span class="cd-sep">:</span>
        <span class="cd-seg"><b>${String(p.mins).padStart(2,'0')}</b><i>דק'</i></span><span class="cd-sep">:</span>
        <span class="cd-seg"><b>${String(p.hours).padStart(2,'0')}</b><i>שעות</i></span><span class="cd-sep">:</span>
        <span class="cd-seg"><b>${p.days}</b><i>ימים</i></span>`;
}
function countdownBlockHtml(id, cls, label, targetTs, now){
  const p = formatCountdownParts(targetTs-now);
  return `
    <div class="comp-countdown countdown-${cls}" data-countdown-target="${targetTs}" data-countdown-id="${id}">
      <span class="countdown-label">${label}</span>
      <span class="countdown-timer" id="${id}">${countdownSegsHtml(p)}</span>
    </div>`;
}
function compCountdownHtml(c){
  const now = Date.now();
  const startTs = parseHebDate(c.start);
  const endTs = parseHebDate(c.end) + 24*60*60*1000 - 1;
  if(now >= endTs){ return `<div class="comp-countdown countdown-ended">🏁 המבצע הסתיים</div>`; }
  if(now < startTs){
    return countdownBlockHtml(`cd-${c.id}`, 'upcoming', '⏳ המבצע יתחיל בעוד', startTs, now);
  }
  return countdownBlockHtml(`cd-${c.id}`, 'active', '⏳ נותרו להשלמת היעד', endTs, now);
}
function tickCountdowns(){
  document.querySelectorAll('.comp-countdown[data-countdown-target]').forEach(el=>{
    const targetTs = parseInt(el.getAttribute('data-countdown-target'),10);
    const cdId = el.getAttribute('data-countdown-id');
    const timerEl = document.getElementById(cdId);
    if(!timerEl) return;
    const remaining = targetTs - Date.now();
    if(remaining <= 0){
      el.outerHTML = cdId.indexOf('cd-end-')===0 ? '' : '<div class="comp-countdown countdown-ended">🏁 המבצע הסתיים</div>';
      return;
    }
    const p = formatCountdownParts(remaining);
    timerEl.innerHTML = countdownSegsHtml(p);
  });
}

function renderGroupForBranch(comp, g, b){
  const pct = b.target>0 ? Math.round((b.sales/b.target)*100) : 0;
  const full = pct>=100;
  const remaining = b.target - b.sales;
  const prizes = g.prizes.slice().sort((x,y)=>x.rank-y.rank);
  const rankedGroup = g.branches.slice().sort((x,y)=>{
    const px = x.target>0 ? x.sales/x.target : 0, py = y.target>0 ? y.sales/y.target : 0;
    return py-px || y.sales-x.sales;
  });
  const myRank = rankedGroup.findIndex(x=>x.rawName===b.rawName) + 1;
  const groupTotalTarget = g.branches.reduce((s,x)=>s+x.target,0);
  const groupTotalSales = g.branches.reduce((s,x)=>s+x.sales,0);
  const groupRemaining = groupTotalTarget - groupTotalSales;
  return `
    <div class="comp-groups">
      <div class="comp-group-block" ${g.colorHex ? `style="border-right:4px solid ${g.colorHex};"` : ''}>
        <div class="comp-group-head">
          <span class="comp-group-name">יעדי ${session.branchName || b.name} <span style="color:var(--muted);font-weight:500;">(${b.rawName})</span></span>
          <span class="comp-target-chip" dir="ltr">יעד ${fmtMoney(b.target)} ₪</span>
        </div>
        <div class="comp-manager-row" style="margin-bottom:6px;">
          <span>שיוך לקבוצה: <b>${g.name}</b></span>
          ${myRank ? `<span style="margin-right:10px;">מקום ${myRank} מתוך ${rankedGroup.length} בקבוצה</span>` : ''}
        </div>
        <div class="comp-kpi-row">
          <div class="comp-kpi"><div class="l">יעד</div><div class="v" dir="ltr">${fmtMoney(b.target)} ₪</div></div>
          <div class="comp-kpi"><div class="l">מכירות בפועל</div><div class="v" dir="ltr">${fmtMoney(b.sales)} ₪</div></div>
          <div class="comp-kpi"><div class="l">אחוז מהיעד</div><div class="v" dir="ltr">${pct}%</div></div>
          <div class="comp-kpi ${remaining<=0?'kpi-done':''}"><div class="l">${remaining<=0?'עברתם את היעד':'נותר להשלמת היעד'}</div><div class="v" dir="ltr">${remaining<=0? '+'+fmtMoney(Math.abs(remaining)) : fmtMoney(remaining)} ₪</div></div>
          <div class="comp-kpi ${groupRemaining<=0?'kpi-done':''}"><div class="l">${groupRemaining<=0?'הקבוצה עברה את היעד':'נותר לכלל הקבוצה'}</div><div class="v" dir="ltr">${groupRemaining<=0? '+'+fmtMoney(Math.abs(groupRemaining)) : fmtMoney(groupRemaining)} ₪</div></div>
        </div>
        <div class="comp-progress-wrap">
          <div class="comp-progress-track"><div class="comp-progress-fill ${full?'full':''}" style="width:${Math.min(100,pct)}%"></div></div>
        </div>
        ${b.areaManager ? `<div class="comp-manager-row">👤 מנהל אזור: ${managerChip(comp, b.areaManager)}</div>` : ''}
        ${prizes.length ? `
        <div class="prize-list">
          ${prizes.map(p=>`<div class="prize-item"><span class="prize-rank">${p.rank}</span><span class="prize-text"><b>${p.label||('מקום '+p.rank)}:</b> ${p.text}</span></div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  `;
}
/* טבלה בסגנון אקסל משותפת לשלושת הטאבים — כותרת בצבע הכותרות המקורי מהאקסל (תכלת),
   ותא "רצועת צבע" ראשון לכל שורה (כמו עמודה A בקובץ המקורי) שמשקף את צבע הקבוצה/מנהל האזור. */
function excelStyleTable(headerLabels, dataRows){
  const headHtml = `<tr>${headerLabels.map(h=>`<th style="background:#00FFFF;color:#1a1a1a;padding:4px 9px;border:1px solid rgba(0,0,0,0.08);font-size:12.5px;font-weight:700;white-space:nowrap;">${h}</th>`).join('')}</tr>`;
  const bodyHtml = dataRows.map(row=>`<tr>${row.map(cell=>{
    const bg = cell.bg || 'transparent';
    const color = cell.textColor || (cell.bg ? contrastTextColor(cell.bg) : 'inherit');
    return `<td style="background:${bg};color:${color};padding:4px 9px;border:1px solid rgba(0,0,0,0.08);white-space:nowrap;font-size:12.5px;${cell.bold?'font-weight:700;':''}">${cell.html!==undefined ? cell.html : (cell.text||'')}</td>`;
  }).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;"><table style="border-collapse:collapse;min-width:100%;">${headHtml}${bodyHtml}</table></div>`;
}
function renderGroupsForAdmin(c){
  const RANK_COLORS = [
    {bg:'#FFD700', text:'#1a1a1a'}, {bg:'#C0C0C0', text:'#1a1a1a'}, {bg:'#CD7F32', text:'#ffffff'},
    {bg:'#4FA8DA', text:'#ffffff'}, {bg:'#8BC34A', text:'#1a1a1a'}
  ];
  return `
    <div class="comp-groups">
      ${c.groups.map(g=>{
        const prizes = g.prizes.slice().sort((x,y)=>x.rank-y.rank);
        const ranked = g.branches.slice().sort((a,b)=>{
          const pa = a.target>0 ? a.sales/a.target : 0, pb = b.target>0 ? b.sales/b.target : 0;
          return pb-pa || b.sales-a.sales;
        });
        return `
        <div class="comp-group-block" ${g.colorHex ? `style="border-right:4px solid ${g.colorHex};"` : ''}>
          <div class="comp-group-head">
            <span class="comp-group-name" style="${g.colorHex?`background:${g.colorHex};color:#000000;padding:3px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;`:''}">${g.name} · ${g.branches.length} סניפים</span>
            <span class="comp-target-chip" dir="ltr">יעד לסניף ${fmtMoney(g.target)} ₪</span>
          </div>
          ${prizes.length ? `
          <div class="prize-list">
            ${prizes.map((p,idx)=>{
              const winner = ranked[idx];
              const rc = RANK_COLORS[idx] || RANK_COLORS[RANK_COLORS.length-1];
              const label = (p.label || ('מקום '+p.rank)).replace(/:\s*$/,''); /* מסיר נקודתיים קיימות בסוף הכיתוב, כדי לא להכפיל אותן */
              return `<div class="prize-item" style="background:var(--page);color:var(--text-primary);border:1px solid var(--border);">
                <span class="prize-rank" style="background:${rc.bg};color:${rc.text};">${p.rank}</span>
                <span class="prize-text">${label}${winner?`: סניף ${winner.rawName}`:''} — ${p.text}</span>
              </div>`;
            }).join('')}
          </div>` : ''}
          ${commentsBox('competitionGroup', `${c.id}::${g.groupNum}`)}
        </div>`;
      }).join('')}
    </div>
  `;
}
/* ---------- טאב 2: לפי מנהל אזור — ממד ארגון שונה לגמרי מהקבוצות (target-tier);
   מפזרים את כל הסניפים מכל הקבוצות ומקבצים מחדש לפי מנהל האזור שלהם.
   כל מנהל: רשימת הסניפים שלו ממוינת מהגבוה לנמוך לפי יעד. ---------- */
/* טבלה בסגנון "AS IS" — כמו excelStyleTable אך מקבלת תאי כותרת אמיתיים (טקסט+צבע
   שנקראו ישירות מהאקסל), לא תוויות קבועות מראש. */
function asIsTable(headerCells, dataRows){
  const headHtml = `<tr>${headerCells.map(h=>{
    const bg = h.bg || '#00FFFF';
    const color = contrastTextColor(bg);
    return `<th style="background:${bg};color:${color};padding:4px 9px;border:1px solid rgba(0,0,0,0.08);font-size:12.5px;font-weight:700;white-space:nowrap;">${h.text||''}</th>`;
  }).join('')}</tr>`;
  const bodyHtml = dataRows.map(row=>`<tr>${row.map(cell=>{
    const bg = cell.bg || 'transparent';
    const color = cell.bg ? contrastTextColor(cell.bg) : 'inherit';
    return `<td style="background:${bg};color:${color};padding:4px 9px;border:1px solid rgba(0,0,0,0.08);white-space:nowrap;font-size:12.5px;">${cell.text||''}</td>`;
  }).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;"><table style="border-collapse:collapse;min-width:100%;">${headHtml}${bodyHtml}</table></div>`;
}
/* ---------- טאב 2: לפי מנהל אזור — טבלת האקסל המקורית AS IS (ערכים+צבעים אמיתיים),
   מפוזרת מחדש לפי מנהל אזור; בכל מנהל: הסניפים ממוינים מהגבוה לנמוך לפי יעד. ---------- */
function renderByAreaManager(c){
  const byManager = {};
  c.groups.forEach(g=>{
    g.branches.forEach(b=>{
      const mgr = b.areaManager || 'ללא שיוך';
      if(!byManager[mgr]) byManager[mgr] = [];
      byManager[mgr].push(b);
    });
  });
  const managers = Object.keys(byManager).map(mgr=>{
    const branches = byManager[mgr].slice().sort((a,b)=> b.target - a.target);
    const totalSales = branches.reduce((s,b)=>s+b.sales,0);
    const totalTarget = branches.reduce((s,b)=>s+b.target,0);
    return {mgr, branches, totalSales, totalTarget};
  }).sort((a,b)=>{
    if(a.mgr==='ללא שיוך') return 1;
    if(b.mgr==='ללא שיוך') return -1;
    return a.mgr.localeCompare(b.mgr, 'he');
  });
  const headerCells = c.headerRowCells || [
    {text:'שם חנות', bg:'#00FFFF'}, {text:'יעד', bg:'#00FFFF'}, {text:'מכירות', bg:'#00FFFF'},
    {text:'אחוז מהיעד', bg:'#00FFFF'}, {text:'מנהל אזור', bg:'#00FFFF'}
  ];
  const grandTarget = managers.reduce((s,m)=>s+m.totalTarget,0);
  const grandSales = managers.reduce((s,m)=>s+m.totalSales,0);
  return `
    <div class="scroll-hint"><span class="arrow right">→</span> ניתן להחליק את הטבלה ימינה ושמאלה <span class="arrow left">←</span></div>
    <div class="comp-groups">
      ${managers.map(m=>{
        const pct = m.totalTarget>0 ? Math.round(m.totalSales/m.totalTarget*100) : 0;
        const hex = c.managerColors ? c.managerColors[m.mgr] : null;
        const tableRows = m.branches.map(b => b.rowCells ? [b.rowCells.name, b.rowCells.target, b.rowCells.sales, b.rowCells.pct, b.rowCells.manager] : [
          {text:b.rawName}, {text:fmtMoney(b.target)+' ₪'}, {text:fmtMoney(b.sales)+' ₪'}, {text:(b.target>0?Math.round(b.sales/b.target*100):0)+'%'}, {text:b.areaManager||''}
        ]);
        return `
        <div class="comp-group-block" ${hex ? `style="border-right:4px solid ${hex};"` : ''}>
          <div class="comp-group-head">
            <span class="comp-group-name">${m.mgr!=='ללא שיוך' ? managerChip(c, m.mgr) : m.mgr} · ${m.branches.length} סניפים</span>
            <span class="comp-target-chip" dir="ltr">${pct}% מהיעד המצטבר · מהגבוה לנמוך לפי יעד</span>
          </div>
          ${asIsTable(headerCells, tableRows)}
        </div>`;
      }).join('')}
      <div class="comp-group-block" style="border-right:4px solid #F4CCCC;">
        <div class="comp-group-head">
          <span class="comp-group-name" style="font-weight:700;">סה״כ כלל הרשת</span>
          <span class="comp-target-chip" dir="ltr">${grandTarget>0?Math.round(grandSales/grandTarget*100):0}% מהיעד המצטבר</span>
        </div>
        <div style="display:flex;gap:24px;font-size:14px;">
          <div><span style="color:var(--text-secondary);">סה״כ יעד: </span><strong dir="ltr">${fmtMoney(grandTarget)} ₪</strong></div>
          <div><span style="color:var(--text-secondary);">סה״כ מכירות: </span><strong dir="ltr">${fmtMoney(grandSales)} ₪</strong></div>
        </div>
      </div>
    </div>
  `;
}
/* ---------- טאב 3: סיכום אזורי כללי — טבלת אקסל: מנהל אזור (בצבעו) | אחוז מהיעד |
   סכום נמכר | יעד, ממוין מאחוז היעד הגבוה לנמוך, עם שורת סה"כ ורודה בתחתית. ---------- */
function renderAreaManagerSummary(c){
  const byManager = {};
  c.groups.forEach(g=>{
    g.branches.forEach(b=>{
      if(!b.areaManager) return; /* סניפים ללא שיוך למנהל אזור לא נכנסים לדירוג הזה */
      const mgr = b.areaManager;
      if(!byManager[mgr]) byManager[mgr] = {sales:0, target:0};
      byManager[mgr].sales += b.sales;
      byManager[mgr].target += b.target;
    });
  });
  const rows = Object.keys(byManager).map(mgr=>{
    const d = byManager[mgr];
    const pct = d.target>0 ? (d.sales/d.target*100) : 0;
    return {mgr, ...d, pct};
  }).sort((a,b)=>b.pct-a.pct);
  const totalTarget = rows.reduce((s,r)=>s+r.target,0);
  const totalSales = rows.reduce((s,r)=>s+r.sales,0);
  const totalPct = totalTarget>0 ? (totalSales/totalTarget*100) : 0;
  const HEAD_BLUE = '#BDD7EE';
  const TOTAL_PINK = '#F4CCCC';
  const cellStyle = 'padding:6px 12px;border:1px solid rgba(0,0,0,0.15);font-size:13.5px;text-align:center;';
  const headHtml = `<tr>
    <th style="background:#ffffff;color:#1a1a1a;${cellStyle}font-weight:700;">מנהל אזור</th>
    <th style="background:${HEAD_BLUE};color:#1a1a1a;${cellStyle}font-weight:700;">אחוז מהיעד</th>
    <th style="background:${HEAD_BLUE};color:#1a1a1a;${cellStyle}font-weight:700;">סכום נמכר</th>
    <th style="background:${HEAD_BLUE};color:#1a1a1a;${cellStyle}font-weight:700;">יעד</th>
  </tr>`;
  const bodyHtml = rows.map((r,idx)=>{
    const hex = (c.managerColors && c.managerColors[r.mgr]) || '#ffffff';
    const mgrTextColor = contrastTextColor(hex);
    return `<tr>
      <td style="background:${hex};color:${mgrTextColor};${cellStyle}font-weight:600;">${idx===0?'👑 ':''}${r.mgr}</td>
      <td style="background:#ffffff;color:#1a1a1a;${cellStyle}font-weight:700;" dir="ltr">${r.pct.toFixed(2)}%</td>
      <td style="background:#ffffff;color:#1a1a1a;${cellStyle}" dir="ltr">${r.sales ? fmtMoney(r.sales)+' ₪' : ''}</td>
      <td style="background:#ffffff;color:#1a1a1a;${cellStyle}font-weight:700;" dir="ltr">${fmtMoney(r.target)} ₪</td>
    </tr>`;
  }).join('');
  const totalHtml = `<tr>
    <td style="background:${TOTAL_PINK};color:#1a1a1a;${cellStyle}font-weight:700;">סה״כ</td>
    <td style="background:${TOTAL_PINK};color:#1a1a1a;${cellStyle}font-weight:700;" dir="ltr">${totalPct.toFixed(2)}%</td>
    <td style="background:${TOTAL_PINK};color:#1a1a1a;${cellStyle}font-weight:700;" dir="ltr">${totalSales ? fmtMoney(totalSales)+' ₪' : '0 ₪'}</td>
    <td style="background:${TOTAL_PINK};color:#1a1a1a;${cellStyle}font-weight:700;" dir="ltr">${fmtMoney(totalTarget)} ₪</td>
  </tr>`;
  return `
    <div class="card">
      <h3 style="text-align:center;margin:0 0 12px;font-size:16px;">${c.title}${c.start&&c.end?` <span dir="ltr">${c.start}–${c.end}</span>`:''} - מנהלי אזור</h3>
      <div class="scroll-hint"><span class="arrow right">→</span> ניתן להחליק את הטבלה ימינה ושמאלה <span class="arrow left">←</span></div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table style="border-collapse:collapse;min-width:100%;">${headHtml}${bodyHtml}${totalHtml}</table>
      </div>
    </div>
  `;
}
/* ---------- עטיפת שלושת הטאבים ---------- */

  const rowsHtml = c.rawTable.map(row=>`
    <tr>${(row.cells||[]).map(cell=>{
      const bg = cell.bg || 'transparent';
      const color = cell.bg ? contrastTextColor(cell.bg) : 'inherit';
      return `<td style="background:${bg};color:${color};padding:4px 9px;border:1px solid rgba(0,0,0,0.08);white-space:nowrap;font-size:12.5px;">${cell.text || ''}</td>`;
    }).join('')}</tr>
  `).join('');

    <div class="scroll-hint"><span class="arrow right">→</span> ניתן להחליק את הטבלה ימינה ושמאלה <span class="arrow left">←</span></div>
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;">

function renderCompetitionTabs(c){
  return `
    <div class="comp-tabs-nav">

      <button class="comp-tab-btn" data-ctab="area" id="ctab-btn-area-${c.id}" onclick="switchCompTab('${c.id}','area')">תצוגה לפי איזור</button>
      <button class="comp-tab-btn" data-ctab="summary" id="ctab-btn-summary-${c.id}" onclick="switchCompTab('${c.id}','summary')">סיכום איזורי כללי</button>

function switchCompTab(compId, tab){
  ['general','area','summary'].forEach(t=>{
    const content = document.getElementById(`ctab-${t}-${compId}`);
    const btn = document.getElementById(`ctab-btn-${t}-${compId}`);
    if(content) content.style.display = (t===tab) ? '' : 'none';
    if(btn) btn.classList.toggle('active', t===tab);
  });
}
function renderNetworkRanking(c, myKey){
  const all = [];

  c.groups.forEach(g=>{
    g.branches.forEach(b=>{
      const pct = b.target>0 ? Math.round((b.sales/b.target)*100) : 0;
      all.push({rawName:b.rawName, groupName:g.name, sales:b.sales, pct});
    });
  });
  all.sort((x,y)=> y.pct-x.pct || y.sales-x.sales);
  return `
    <div class="comp-foot" style="margin-top:14px;border-top:1px solid var(--gridline);padding-top:12px;">
      <button class="link-btn" onclick="toggleLB('net-${c.id}')">📊 השוואה ארצית — כל ${all.length} סניפי הרשת בתחרות זו <span id="lb-arrow-net-${c.id}">▾</span></button>
    </div>
    <div class="leaderboard" id="lb-net-${c.id}">
      ${all.map((b,idx)=>`
        <div class="lb-row ${idx===0?'top1':idx===1?'top2':idx===2?'top3':''} ${b.rawName===myKey?'lb-mine':''}">
          <div class="lb-rank">${idx+1}</div>
          <div class="lb-name">${b.rawName}${b.rawName===myKey?' (אתם)':''} <span style="color:var(--muted);font-weight:500;font-size:11px;">· ${b.groupName}</span></div>
          <div class="lb-score">${b.pct}%</div>
        </div>
      `).join('')}
    </div>
  `;
}
function toggleGroupTable(compId, groupNum){
  const el = document.getElementById(`grp-table-${compId}-${groupNum}`);
  const arrow = document.getElementById(`grp-arrow-${compId}-${groupNum}`);
  el.classList.toggle('open');
  arrow.textContent = el.classList.contains('open') ? '▴' : '▾';
}
function toggleLB(id){
  const el = document.getElementById('lb-'+id);
  const arrow = document.getElementById('lb-arrow-'+id);
  el.classList.toggle('open');
  arrow.textContent = el.classList.contains('open') ? '▴' : '▾';
}

/* ---------- Instructions ---------- */
function renderInstructionExecutionArea(instr, myStatus){

  return `
    <div class="instr-task-area" onclick="event.stopPropagation();">
      <div class="instr-task-head">ביצוע המשימה</div>
      <div class="instr-task-due">לביצוע עד: <span dir="ltr">${instr.dueDate||''}</span>${myStatus==='overdue' && !myCompletion ? ' · <b style="color:var(--critical);">באיחור</b>' : ''}</div>

function renderInstructionStatusPanel(instr){

        <button class="comp-tab-btn ${instrStatusFilter==='done'?'active':''}" style="${instrStatusFilter==='done'?'background:#457a1f;border-color:#457a1f;color:#fff;':''}" onclick="setInstrStatusFilter('done')">בוצע</button>

/* ============================================================
   שיחות עם מנהל האזור — כלי רוחבי עצמאי (לא חלק ממחלקת שיווק)
   ------------------------------------------------------------
   שתי הקולקציות הקיימות נשארות, רק מורחבות:
   - areaInstructions: "כותרת העדכון" ששלח מנהל האזור. נשארת בדיוק כמו
     שהייתה. ההודעה הראשונה של כל שיחה נשלפת ישירות מכאן (title+body),
     ולא משוכפלת לתוך מסמך השיחה עצמה.
   - areaInstructionConfirmations: מסמך נפרד לכל <instructionId>__<branchEmail>
     (בדיוק כמו standConfirmations) — הופך כאן ל"שיחה פרטית" מלאה בין
     מנהל האזור לסניף הספציפי הזה. שדות חדשים: messages (מערך הודעות
     הלוך-חזור), conversationStatus ('open'/'closed'), branchReadCount/
     areaReadCount (מעקב "לא נקרא" פשוט — כמה הודעות כל צד כבר ראה).
   תאימות אחורה: הוראות/אישורים שנוצרו לפני השדרוג הזה (עם note+confirmedAt
   בלבד, בלי messages) ממשיכים להיות נגישים ומוצגים כשיחה קצרה שכבר
   נסגרה — ראו conversationStatusOf ו-buildConversationMessages.
   ============================================================ */
function createAreaInstruction(title, body, targetScope, specificBranchEmail){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  if(!isRealAreaManager()) return;
  if(!title || !title.trim()){ toast('נא למלא כותרת'); return; }
  const areaBranches = BRANCH_DIRECTORY.filter(b=>b.area===session.areaLabel);
  let targetBranchEmails;
  if(targetScope==='specific'){
    if(!specificBranchEmail){ toast('נא לבחור סניף'); return; }
    targetBranchEmails = [specificBranchEmail];
  } else if(targetScope==='multi'){
    targetBranchEmails = Array.from(document.querySelectorAll('.f-area-instr-multi-cb:checked')).map(function(el){return el.value;});
    if(!targetBranchEmails.length){ toast('נא לבחור לפחות סניף אחד'); return; }
  } else {
    targetBranchEmails = areaBranches.map(b=>b.email).filter(Boolean);
  }
  if(!targetBranchEmails.length){ toast('לא נמצאו סניפים ליעד'); return; }
  db.collection('areaInstructions').add({
    areaManagerEmail: currentUserEmail,
    areaLabel: session.areaLabel,
    title: title.trim(),
    body: (body||'').trim(),
    targetScope,
    targetBranchEmails,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    closeModal();
    toast('העדכון נשלח');
  }).catch(function(err){ toast('שגיאה: ' + err.message); });
}

function getAreaConversation(instructionId, branchEmail){
  return (appData.areaInstructionConfirmations||[]).find(function(c){
    return c.instructionId===instructionId && c.branchEmail===branchEmail;
  }) || null;
}
/* סטטוס שיחה בפועל: שיחות חדשות משתמשות בשדה conversationStatus מפורש.
   שיחות ישנות (מלפני השדרוג לשיחות אמיתיות) שכבר כללו מסמך אישור (יש בו
   שדה note, גם אם ריק) נחשבות סגורות אוטומטית — כי לא הייתה בהן מלכתחילה
   אפשרות להמשיך ולהגיב. שיחה שטרם החל בה שום דבר (אין עדיין מסמך) —
   פתוחה כברירת מחדל. */
function conversationStatusOf(conv){
  if(!conv) return 'open';
  if(conv.conversationStatus) return conv.conversationStatus;
  if(conv.note !== undefined) return 'closed';
  return 'open';
}
function fmtTsShort(ts){
  if(ts && typeof ts.seconds === 'number') return new Date(ts.seconds*1000).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  return '';
}
/* בונה את רשימת ההודעות המלאה להצגה: הודעה ראשונה תמיד גוף ההוראה המקורי
   (נשלף מ-areaInstructions, לא משוכפל לתוך מסמך השיחה), ואחריה הודעות
   מ-messages (סכימה חדשה), או הערת אישור בודדת מ-note (סכימה ישנה —
   תאימות אחורה, מוצגת רק אם אכן נכתבה הערה). */
function buildConversationMessages(instr, conv){
  const areaLabel = (AREA_MANAGER_INFO[instr.areaManagerEmail]||{}).label || 'מנהל האזור';
  const msgs = [{
    senderRole:'area', senderLabel: areaLabel,
    body: instr.title + (instr.body ? '\n'+instr.body : ''),
    createdAtLabel: fmtTsShort(instr.createdAt),
    idx: -1
  }];
  if(conv && conv.messages && conv.messages.length){
    conv.messages.forEach(function(m, i){ msgs.push(Object.assign({}, m, {idx: i})); });
  } else if(conv && conv.note){
    msgs.push({ senderRole:'branch', senderLabel: conv.branchName||'', body: conv.note, createdAtLabel: fmtTsShort(conv.confirmedAt), idx: -1 });
  }
  return msgs;
}
function safeConvId(instructionId, branchEmail){
  return instructionId + '__' + (branchEmail||'').replace(/[^a-zA-Z0-9]/g,'_');
}
function conversationUnreadFor(conv, viewerRole){
  if(!conv || !conv.messages || !conv.messages.length) return false;
  const field = viewerRole==='branch' ? 'branchReadCount' : 'areaReadCount';
  return conv.messages.length > (conv[field]||0);
}
function sendConversationMessage(instructionId, branchEmail, areaManagerEmail, senderRole, senderLabel, bodyText){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const text = (bodyText||'').trim();
  if(!text) return;
  const id = safeConvId(instructionId, branchEmail);
  const existing = getAreaConversation(instructionId, branchEmail);
  if(conversationStatusOf(existing)==='closed'){ toast('השיחה סגורה'); return; }
  const msg = {
    senderRole, senderLabel: senderLabel||'',
    body: text,
    createdAtLabel: todayHeb() + ' ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})
  };
  const newCount = ((existing && existing.messages) ? existing.messages.length : 0) + 1;
  const update = {
    instructionId, areaManagerEmail, branchEmail,
    branchName: session.branchInfo ? session.branchInfo.name : (existing ? existing.branchName : ((BRANCH_DIRECTORY.find(b=>b.email===branchEmail)||{}).name||'')),
    messages: firebase.firestore.FieldValue.arrayUnion(msg)
  };
  update[senderRole==='branch' ? 'branchReadCount' : 'areaReadCount'] = newCount;
  db.collection('areaInstructionConfirmations').doc(id).set(update, {merge:true})
    .then(function(){ renderContent(); })
    .catch(function(err){ toast('שגיאה בשליחת ההודעה: ' + err.message); });
}
function ackConversation(instructionId, branchEmail, areaManagerEmail){
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const id = safeConvId(instructionId, branchEmail);
  db.collection('areaInstructionConfirmations').doc(id).set({
    instructionId, areaManagerEmail, branchEmail,
    branchName: session.branchInfo ? session.branchInfo.name : '',
    confirmedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).then(function(){
    toast('האישור נשלח');
    renderContent();
  }).catch(function(err){ toast('שגיאה: ' + err.message); });
}
function closeAreaConversation(instructionId, branchEmail){

/* פתיחת שיחה סגורה מחדש - רק מנהל האזור, בלי אישור נוסף (פעולה הפיכה,
   לא הרסנית כמו סגירה). עובד גם על שיחות ישנות (סטטוס משוער מ-note) כי
   הכתיבה קובעת שדה conversationStatus מפורש שגובר על ההשערה. */
function reopenAreaConversation(instructionId, branchEmail){
  if(!isRealAreaManager()) return;
  if(previewMode){ toast('פעולה לא זמינה במצב תצוגה'); return; }
  const id = safeConvId(instructionId, branchEmail);
  db.collection('areaInstructionConfirmations').doc(id).set({
    instructionId, branchEmail,
    areaManagerEmail: currentUserEmail,
    conversationStatus: 'open'
  }, {merge:true}).then(function(){
    toast('השיחה נפתחה מחדש');
    renderContent();
  }).catch(function(err){ toast('שגיאה: ' + err.message); });
}
function markConversationRead(instructionId, branchEmail, viewerRole){
  const conv = getAreaConversation(instructionId, branchEmail);
  const count = (conv && conv.messages) ? conv.messages.length : 0;
  const field = viewerRole==='branch' ? 'branchReadCount' : 'areaReadCount';
  if(conv && (conv[field]||0) >= count) return;
  if(!conv && count===0) return; // אין עדיין מסמך ואין מה לסמן כנקרא - לא ליצור מסמך ריק לשווא
  const id = safeConvId(instructionId, branchEmail);
  const update = { instructionId, branchEmail };
  if(viewerRole==='area') update.areaManagerEmail = currentUserEmail;
  update[field] = count;
  db.collection('areaInstructionConfirmations').doc(id).set(update, {merge:true}).catch(function(){});
}
function openConversationThread(instructionId, branchEmail, viewerRole){
  ui.conversationOpenKey = instructionId + '__' + branchEmail;
  markConversationRead(instructionId, branchEmail, viewerRole);
  renderContent();
  renderNav();
}
function closeConversationThread(){
  ui.conversationOpenKey = null;
  renderContent();
}
/* רינדור משותף לשיחה בודדת — משמש גם למסך הסניף וגם למסך מנהל האזור. */
function renderConversationThreadHtml(instr, conv, viewerRole){
  const status = conversationStatusOf(conv);
  const messages = buildConversationMessages(instr, conv);
  const branchEmail = viewerRole==='branch' ? session.branchInfo.email : (conv ? conv.branchEmail : '');
  const branchName = viewerRole==='branch' ? session.branchName : ((conv && conv.branchName) || (BRANCH_DIRECTORY.find(b=>b.email===branchEmail)||{}).name || branchEmail);
  const acked = !!(conv && conv.confirmedAt);
  const areaLabel = (AREA_MANAGER_INFO[instr.areaManagerEmail]||{}).label || 'מנהל האזור';
  return `
    <div class="page-head">
      <button class="link-btn" onclick="closeConversationThread()">→ חזרה לרשימת השיחות</button>
      <h1 style="margin-top:8px;">${instr.title}</h1>
      <p>${viewerRole==='area' ? `מול ${branchName}` : `מול מנהל האזור שלכם`} · <span style="${status==='open'?'color:var(--good,#0ca30c);':'color:var(--muted);'}">${status==='open'?'🟢 שיחה פתוחה':'🔒 שיחה סגורה'}</span></p>
    </div>
    <div class="card">
      ${viewerRole==='branch' ? `
        <div style="margin-bottom:12px;">
          ${acked ? `<span style="font-size:13px;color:var(--good,#0ca30c);">✓ התקבל ואושר</span>` : `<button class="btn-confirm" onclick="ackConversation('${instr.id}','${session.branchInfo.email}','${instr.areaManagerEmail}')">✓ קראתי ואישרתי קבלה</button>`}
        </div>
      ` : ''}
      <div class="aconv-thread">
        ${messages.map(function(m){
          const mine = m.senderRole===viewerRole;
          let seenHtml = '';
          if(mine && m.idx>=0 && conv){
            const otherReadCount = viewerRole==='branch' ? (conv.areaReadCount||0) : (conv.branchReadCount||0);
            if(otherReadCount > m.idx) seenHtml = ' · 👁 נצפה';
          }
          return `
            <div class="aconv-msg ${m.senderRole==='area'?'from-area':'from-branch'}">
              <div>${m.body}</div>
              <div class="aconv-msg-meta">${m.senderRole==='area' ? areaLabel : (m.senderLabel||branchName||'')} · ${m.createdAtLabel||''}${seenHtml}</div>
            </div>
          `;
        }).join('')}
      </div>
      ${status==='open' ? `
        <div class="aconv-input-row">
          <input type="text" id="aconv-input-${instr.id}" placeholder="כתבו הודעה...">
          <button class="btn-confirm" onclick="sendConversationMessage('${instr.id}','${branchEmail}','${instr.areaManagerEmail}','${viewerRole}','${viewerRole==='branch'?(session.branchName||''):areaLabel}', document.getElementById('aconv-input-${instr.id}').value)">שליחה</button>
        </div>
        ${viewerRole==='area' ? `<button class="link-btn" style="margin-top:10px;" onclick="closeAreaConversation('${instr.id}','${branchEmail}')">🔒 סגירת שיחה</button>` : ''}
      ` : `
        <div class="aconv-closed-banner">
          🔒 השיחה נסגרה על ידי מנהל האזור<br>ניתן לצפות בהתכתבות, אך לא ניתן לשלוח תגובות נוספות.
        </div>
        ${viewerRole==='area' ? `<button class="btn-secondary" style="margin-top:10px;width:100%;" onclick="reopenAreaConversation('${instr.id}','${branchEmail}')">🔓 פתיחת השיחה מחדש</button>` : ''}
      `}
    </div>
  `;
}
/* מסך הסניף: רשימת שיחות עם מנהל האזור + פירוט שיחה בודדת. */
function viewBranchConversations(){
  const myEmail = session.branchInfo ? session.branchInfo.email : null;
  if(ui.conversationOpenKey){
    const parts = ui.conversationOpenKey.split('__');
    const instrId = parts[0];
    const instr = (appData.areaInstructions||[]).find(function(i){return i.id===instrId;});
    if(instr) return renderConversationThreadHtml(instr, getAreaConversation(instrId, myEmail), 'branch');
    ui.conversationOpenKey = null;
  }
  const list = (appData.areaInstructions||[])
    .filter(function(instr){ return (instr.targetBranchEmails||[]).indexOf(myEmail)!==-1; })
    .map(function(instr){
      const conv = getAreaConversation(instr.id, myEmail);
      return { instr, conv, status: conversationStatusOf(conv), unread: !conv || conversationUnreadFor(conv,'branch') };
    })
    .sort(function(a,b){
      const rank = function(x){ return x.unread ? 0 : (x.status==='open' ? 1 : 2); };
      const rd = rank(a)-rank(b);
      if(rd!==0) return rd;
