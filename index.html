<!-- ============================================================
     FIREBASE — פיילוט אחסון אמיתי
     ------------------------------------------------------------
     שלבים להפעלה (חד-פעמי):
     1. https://console.firebase.google.com → צור פרויקט חדש (בחשבון Google שלך).
     2. Build > Authentication > Sign-in method → הפעל "Google".
     3. Build > Firestore Database → צור מסד נתונים (Start in production mode).
        אחרי היצירה, בלשונית Rules הדבק (מגביל גישה למי שמחובר בלבד):
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if request.auth != null;
              }
            }
          }
     4. Project settings (⚙) > General > "Your apps" > הוסף אפליקציית Web (</>) → יופיע אובייקט קונפיג.
     5. הדבק את הערכים במקום ה-PLACEHOLDER-ים למטה.
     6. Build > Authentication > Settings > Authorized domains → הוסף את הדומיין שבו יתארח הקובץ (netlify וכו').
     עד שלא יוגדר קונפיג אמיתי, שלד זה לא יפעיל שום דבר, והמערכת ממשיכה לעבוד במצב ההדגמה הקיים (זיכרון דפדפן).
============================================================ -->

<script>


/* מסך נחיתה למחלקה שיש לה מסכי תוכן (בשונה מ-viewDepartmentEmpty, שמיועד
   למחלקה שעדיין לא פרסמה כלום). מציג כרטיסי בחירה לכל מסך במחלקה. */
function viewDepartmentLanding(deptKey){
  const info = DEPARTMENTS[deptKey] || {label: deptKey};
  const screens = DEPARTMENT_SCREENS[deptKey] || [];
  return `
    <div class="page-head">
      <h1>${info.label}</h1>
      <p>בחרו מה לצפות</p>
    </div>
    <div class="dashboard-actions-grid">
      ${screens.map(s=>`<button class="dashboard-action-btn" onclick="goTo('${s.id}')"><span class="da-icon">${s.icon}</span><span class="da-label">${s.label}</span></button>`).join('')}
    </div>
  `;
}

/* ---------- Boot ---------- */
initLogin();
/* כשהמשתמש חוזר לטאב (למשל אחרי שהלך לשנות הרשאת התראות בהגדרות הדפדפן
   ולחזר), מרעננים את מצב כפתורי ה-Push בלי לחכות לרענון המלא של 10 הדקות. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && typeof updatePushButtonsVisibility === 'function') updatePushButtonsVisibility();
});
setInterval(tickCountdowns, 1000);
checkStandReminders();
setInterval(checkStandReminders, 5*60*1000);

/* רענון עדין ואוטומטי כל 10 דקות — הנתונים עצמם כבר מתעדכנים בזמן אמת דרך
   Firestore בלי צורך ברענון, אבל עדכוני קוד (גרסה חדשה של האתר) דורשים טעינה
   מחדש בפועל. לא מרענן אם יש חלון פתוח או שהמשתמש כרגע מקליד, כדי לא לאבד
   טקסט שלא נשמר (למשל באמצע כתיבת הודעה פרטית). */
setInterval(function(){
  const modalOverlay = document.getElementById('modal-overlay');
  const modalOpen = modalOverlay && modalOverlay.classList.contains('open');
  const typing = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(!modalOpen && !typing){
    location.reload();
  }
}, 10*60*1000);
</script>
